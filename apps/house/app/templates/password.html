{% extends "base.html" %}
{% block title %}New password · Overseer{% endblock %}
{% block tabs %}{% endblock %}
{% block content %}
<div class="gate">
  <div class="gate-head">
    <span class="mark">{{ icon("bolt", 30) }}</span>
    <h1 class="hero-h">Choose a password</h1>
    <p class="hero-s">It replaces the one you signed in with.</p>
  </div>
  {% if error %}<p class="formerr" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/password" class="gate-form">
    <div class="field">
      <label for="f-current">Current password</label>
      <input class="inp" id="f-current" name="current" type="password"
             autocomplete="current-password" required autofocus>
    </div>
    <div class="field">
      <label for="f-new">New password</label>
      <input class="inp" id="f-new" name="new" type="password"
             autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="f-repeat">Same again</label>
      <input class="inp" id="f-repeat" name="repeat" type="password"
             autocomplete="new-password" minlength="8" required>
    </div>
    <button class="bigbtn" type="submit">Set password</button>
  </form>
</div>
{% endblock %}
