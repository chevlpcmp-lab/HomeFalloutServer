<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0E">
  <title>{% block title %}Overseer{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body data-page="{{ page|default('') }}">
{% include "_icons.html" %}
<main class="pane">
{% block content %}{% endblock %}
</main>
{% block tabs %}
{% if user %}
<nav class="tabs {{ 'four' if user.is_admin else 'three' }}" aria-label="Sections">
  <a class="tab{{ ' on' if page == 'remote' }}" href="/">{{ icon("tv", 19) }}<span>Remote</span></a>
  <a class="tab{{ ' on' if page == 'jellyfin' }}" href="/jellyfin">{{ icon("film", 19) }}<span>Jellyfin</span></a>
  <a class="tab{{ ' on' if page == 'lights' }}" href="/lights">{{ icon("bulb", 19) }}<span>Lights</span></a>
  {% if user.is_admin %}
  <a class="tab{{ ' on' if page == 'people' }}" href="/people">{{ icon("users", 19) }}<span>People</span></a>
  {% endif %}
</nav>
{% endif %}
{% endblock %}
<script src="/static/app.js?v={{ asset_v }}" defer></script>
</body>
</html>
