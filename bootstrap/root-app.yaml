apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homefallout-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:chevlpcmp-lab/HomeFalloutServer.git
    targetRevision: main
    path: platform
    helm:
      valueFiles:
        - values/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
