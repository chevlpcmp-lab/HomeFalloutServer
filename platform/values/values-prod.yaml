environment: prod

repo:
  url: git@github.com:chevlpcmp-lab/HomeFalloutServer.git
  revision: main

defaults:
  project: infrastructure

# Each component phase is derived from its tier: pre-resources (-1), chart (0),
# then resources (+1). The spacing leaves room for waveOffset fine-tuning.
tiers:
  bootstrap: 0
  network: 20
  storage: 40
  security: 60
  apps: 80

projects:
  infrastructure:
    description: Cluster-level services managed by this repository.
    destinations: ["*"]
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
  applications:
    description: Home media and photo applications.
    destinations: [media, photos]
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace

components:
  - name: namespaces
    tier: bootstrap
    namespace: argocd
    resources:
      enabled: true

  # LAN LoadBalancer address for the Argo CD UI (10.0.0.200).
  - name: argocd
    tier: network
    waveOffset: 2
    namespace: argocd
    resources:
      enabled: true

  - name: metallb
    tier: network
    namespace: networking
    chart:
      repoURL: https://metallb.github.io/metallb
      name: metallb
      version: "0.15.3"
    resources:
      enabled: true

  # Tailscale subnet router: advertises the LAN and cluster networks to the
  # tailnet for remote access to everything (Argo CD, Proxmox, media apps).
  - name: tailscale
    tier: network
    waveOffset: 4
    namespace: networking
    resources:
      enabled: true

  # Ingress controller for the whole lab (10.0.0.201). k3s was told not to install
  # its bundled Traefik, so this is the cluster's only ingress.
  - name: traefik
    tier: network
    waveOffset: 6
    namespace: networking
    chart:
      repoURL: https://traefik.github.io/charts
      name: traefik
      version: "41.2.0"

  # Network-wide DNS filtering (10.0.0.202), and the resolver that answers
  # *.home.lan with Traefik's address.
  - name: adguard
    tier: network
    waveOffset: 8
    namespace: networking
    resources:
      enabled: true

  - name: storage
    tier: storage
    namespace: media
    resources:
      enabled: true

  - name: sealed-secrets
    tier: security
    namespace: secrets
    chart:
      repoURL: https://bitnami.github.io/sealed-secrets
      name: sealed-secrets
      version: "2.19.1"

  - name: media-stack
    tier: apps
    namespace: media
    project: applications
    resources:
      enabled: true

  - name: homarr
    tier: apps
    waveOffset: 2
    namespace: media
    project: applications
    resources:
      enabled: true

  - name: jellyfin
    tier: apps
    waveOffset: 4
    namespace: media
    project: applications
    resources:
      enabled: true

  - name: immich
    tier: apps
    waveOffset: 6
    namespace: photos
    project: applications
    resources:
      enabled: true

  - name: komga
    tier: apps
    waveOffset: 8
    namespace: media
    project: applications
    resources:
      enabled: true

  # The household remote (10.0.0.241). Talks to the Samsung TV, the Hue bridge, and
  # Jellyfin, and hands roommates their own logins. Runs on hostNetwork - see the
  # component for why - so it must not share a node with anything else on 8123.
  - name: home-assistant
    tier: apps
    waveOffset: 9
    namespace: media
    project: applications
    resources:
      enabled: true

  # Overseer (10.0.0.242, house.home.lan): the housemates' own remote. A small
  # FastAPI app from apps/house that drives the TV, the Hue rooms, and ambient
  # sync through Home Assistant, with per-person logins and per-room permissions.
  # First self-built image in the repo - ghcr.io/chevlpcmp-lab/house, pinned by
  # sha in the component.
  - name: house
    tier: apps
    waveOffset: 11
    namespace: media
    project: applications
    resources:
      enabled: true

  # Hostnames for everything, synced last because each rule names a Service that the
  # components above create. Uses the infrastructure project: its rules span the
  # media, photos, argocd, and networking namespaces, which the applications project
  # is not allowed to touch.
  - name: ingress
    tier: apps
    waveOffset: 12
    namespace: media
    resources:
      enabled: true
