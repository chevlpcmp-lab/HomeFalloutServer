# Copy to house-secrets.yaml (gitignored), fill it in, then run scripts/seal-secrets.ps1.
# Never commit the plaintext file.
#
# HA_TOKEN is a Home Assistant long-lived access token: avatar > Security >
# Long-lived access tokens > Create. It is the only credential Overseer needs, because
# it never talks to the TV or the Hue bridge directly.
#
# SESSION_SECRET signs nothing on its own - sessions are rows in SQLite - but it seeds
# the app's own secrets. Generate 64 hex characters:
#   -join ((1..32) | ForEach-Object { '{0:x2}' -f (Get-Random -Max 256) })
apiVersion: v1
kind: Secret
metadata:
  name: house-secrets
  namespace: media
type: Opaque
stringData:
  HA_URL: http://home-assistant.media.svc.cluster.local:8123
  HA_TOKEN: REPLACE_ME
  SESSION_SECRET: REPLACE_WITH_64_HEX_CHARACTERS
