# Copy to media-secrets.yaml (gitignored), then run scripts/seal-secrets.ps1 after
# the Sealed Secrets controller is available. Never commit this plaintext file.
apiVersion: v1
kind: Secret
metadata:
  name: gluetun-vpn
  namespace: media
type: Opaque
stringData:
  VPN_SERVICE_PROVIDER: protonvpn
  VPN_TYPE: wireguard
  WIREGUARD_PRIVATE_KEY: REPLACE_ME
  SERVER_COUNTRIES: Canada
---
apiVersion: v1
kind: Secret
metadata:
  name: homarr-secrets
  namespace: media
type: Opaque
stringData:
  SECRET_ENCRYPTION_KEY: REPLACE_WITH_64_HEX_CHARACTERS
