# Copy to media-secrets.yaml (gitignored), replace every value, then apply manually.
apiVersion: v1
kind: Secret
metadata:
  name: gluetun-vpn
  namespace: media
type: Opaque
stringData:
  VPN_SERVICE_PROVIDER: protonvpn
  VPN_TYPE: wireguard
  WIREGUARD_PRIVATE_KEY: REPLACE_ME
  SERVER_COUNTRIES: Canada
---
apiVersion: v1
kind: Secret
metadata:
  name: homarr-secrets
  namespace: media
type: Opaque
stringData:
  SECRET_ENCRYPTION_KEY: REPLACE_WITH_64_HEX_CHARACTERS

