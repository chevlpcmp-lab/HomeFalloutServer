apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: immich-postgres, namespace: photos }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources: { requests: { storage: 30Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: immich-model-cache, namespace: photos }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: photos
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels: { app: immich-postgres }
  template:
    metadata:
      labels: { app: immich-postgres }
    spec:
      nodeSelector: { homelab.charles/pool: converged }
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_DATABASE_NAME } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: dshm, mountPath: /dev/shm }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 1536Mi }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: immich-postgres } }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: immich-postgres, namespace: photos }
spec:
  selector: { app: immich-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: immich-redis, namespace: photos }
spec:
  replicas: 1
  selector:
    matchLabels: { app: immich-redis }
  template:
    metadata:
      labels: { app: immich-redis }
    spec:
      nodeSelector: { homelab.charles/pool: converged }
      containers:
        - name: redis
          image: docker.io/valkey/valkey:8.1-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [valkey-cli, ping] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: immich-redis, namespace: photos }
spec:
  selector: { app: immich-redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: immich-machine-learning, namespace: photos }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: immich-machine-learning }
  template:
    metadata:
      labels: { app: immich-machine-learning }
    spec:
      enableServiceLinks: false
      nodeSelector: { homelab.charles/pool: converged }
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release
          ports: [{ name: http, containerPort: 3003 }]
          startupProbe:
            httpGet: { path: /ping, port: 3003 }
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - { name: cache, mountPath: /cache }
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { cpu: "3", memory: 3Gi }
      volumes:
        - { name: cache, persistentVolumeClaim: { claimName: immich-model-cache } }
---
apiVersion: v1
kind: Service
metadata: { name: immich-machine-learning, namespace: photos }
spec:
  selector: { app: immich-machine-learning }
  ports: [{ name: http, port: 3003, targetPort: 3003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: immich-server, namespace: photos }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: immich-server }
  template:
    metadata:
      labels: { app: immich-server }
    spec:
      # Prevent the Service named immich from injecting IMMICH_PORT=tcp://... .
      enableServiceLinks: false
      nodeSelector: { homelab.charles/pool: converged }
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:release
          env:
            - { name: DB_HOSTNAME, value: immich-postgres }
            - { name: REDIS_HOSTNAME, value: immich-redis }
            - { name: IMMICH_MACHINE_LEARNING_URL, value: "http://immich-machine-learning:3003" }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_PASSWORD } }
            - name: DB_DATABASE_NAME
              valueFrom: { secretKeyRef: { name: immich-database, key: DB_DATABASE_NAME } }
          ports: [{ name: http, containerPort: 2283 }]
          startupProbe:
            httpGet: { path: /api/server/ping, port: 2283 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/server/ping, port: 2283 }
            periodSeconds: 15
          volumeMounts:
            - { name: library, mountPath: /usr/src/app/upload }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - { name: library, persistentVolumeClaim: { claimName: photos-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: photos
  annotations: { metallb.io/loadBalancerIPs: "10.0.0.240" }
spec:
  type: LoadBalancer
  selector: { app: immich-server }
  ports: [{ name: http, port: 80, targetPort: 2283 }]
