apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-target-prep-v5
  namespace: networking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: phase9-target-prep-v5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-target-prep-v5
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: prep
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache util-linux >/dev/null
              nsenter -t 1 -m -n chroot /host /bin/bash <<'HOST'
              set -euo pipefail
              STATUS=/home/charles/.local/share/engineering-control/phase9-status
              REPO=/home/charles/Projects/engineering-control
              NODE=/home/charles/.local/share/mise/installs/node/24.19.0/bin/node
              PNPM=/home/charles/.local/share/mise/installs/pnpm/11.23.0/pnpm
              U=(env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus)
              mkdir -p "$STATUS/v5-state" "$STATUS/v5-workspaces"
              chown -R charles:charles "$STATUS"
              rm -f "$STATUS/qualification-v5.PASS" "$STATUS/qualification-v5.FAIL"
              date --iso-8601=seconds > "$STATUS/v5.started"

              used=100
              for i in $(seq 1 60); do
                used="$(df -P / | awk 'NR==2 {gsub("%","",$5); print $5}')"
                [ "$used" -lt 90 ] && break
                sleep 5
              done
              printf 'root_used_percent=%s\n' "$used" > "$STATUS/v5-disk-gate.txt"
              [ "$used" -lt 90 ] || { echo "root disk remains >=90%" > "$STATUS/qualification-v5.FAIL"; exit 2; }

              for canonical in engineering-control-daemon.service engineering-control-mcp.service; do
                if runuser -u charles -- "${U[@]}" systemctl --user is-active --quiet "$canonical"; then
                  echo "canonical target writer unexpectedly active: $canonical" > "$STATUS/qualification-v5.FAIL"
                  exit 2
                fi
              done

              for unit in phase9-rehearsal-daemon phase9-rehearsal-mcp phase9-rehearsal-inspector phase9-rehearsal-litellm phase9-ec-workload phase9-v5-daemon phase9-v5-mcp phase9-v5-inspector phase9-v5-litellm phase9-v5-workload; do
                runuser -u charles -- "${U[@]}" systemctl --user stop "$unit.service" >/dev/null 2>&1 || true
                runuser -u charles -- "${U[@]}" systemctl --user reset-failed "$unit.service" >/dev/null 2>&1 || true
              done
              docker rm -f ec-phase9-rehearsal-pg ec-phase9-capacity-pg ec-phase9-v5-pg >/dev/null 2>&1 || true

              if ! runuser -u charles -- /home/charles/.local/lib/engineering-control-litellm/1.104.0/bin/litellm --version >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv >/dev/null
                rm -rf /home/charles/.local/lib/engineering-control-litellm/1.104.0
                install -d -o charles -g charles /home/charles/.local/lib/engineering-control-litellm
                runuser -u charles -- python3 -m venv /home/charles/.local/lib/engineering-control-litellm/1.104.0
                runuser -u charles -- /home/charles/.local/lib/engineering-control-litellm/1.104.0/bin/pip install --disable-pip-version-check --quiet "litellm==1.104.0"
              fi

              REV="$(runuser -u charles -- git -C "$REPO" rev-parse --short=12 HEAD)"
              RELEASE=/home/charles/.local/lib/engineering-control-inspector/releases/${REV}-phase9-v5
              install -d -o charles -g charles "$RELEASE"
              rm -rf "$RELEASE/dist" "$RELEASE/package.json" "$RELEASE/node_modules"
              cp -a "$REPO/dist" "$REPO/package.json" "$RELEASE/"
              ln -s "$REPO/node_modules" "$RELEASE/node_modules"
              chown -R charles:charles "$RELEASE"
              ln -sfn "$RELEASE" /home/charles/.local/lib/engineering-control-inspector/current
              chown -h charles:charles /home/charles/.local/lib/engineering-control-inspector/current

              docker run -d --name ec-phase9-v5-pg --restart no -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:15447:5432 postgres:18 >/dev/null
              for i in $(seq 1 60); do
                docker exec ec-phase9-v5-pg pg_isready -U postgres >/dev/null 2>&1 && break
                sleep 1
              done
              docker exec ec-phase9-v5-pg pg_isready -U postgres >/dev/null
              docker exec ec-phase9-v5-pg psql -U postgres -v ON_ERROR_STOP=1                 -c "CREATE ROLE ecdbos LOGIN;"                 -c "CREATE ROLE ecstate LOGIN;"                 -c "CREATE DATABASE ecdbos OWNER ecdbos;"                 -c "CREATE DATABASE ecstate OWNER ecstate;" >/dev/null
              runuser -u charles -- "$NODE" --input-type=module -e                 "import { PostgresStateStore } from '$REPO/dist/packages/state/src/index.js'; const s=await PostgresStateStore.open('postgresql://ecstate@127.0.0.1:15447/ecstate','99999999-9999-4999-8999-999999999999'); await s.close();"
              docker exec ec-phase9-v5-pg psql -U ecstate -d ecstate -v ON_ERROR_STOP=1 -c                 "UPDATE engineering_control_state.stream_heads SET authority_mode='canonical', authority_epoch=1, cutover_source_revision=0, cutover_source_sha256=repeat('0',64), qualified_at=now() WHERE stream_id='canonical';" >/dev/null

              cat > "$STATUS/v5-state.env" <<'EOF'
              ENGINEERING_CONTROL_STATE_BACKEND=postgres
              ENGINEERING_CONTROL_STATE_DATABASE_URL=postgresql://ecstate@127.0.0.1:15447/ecstate
              ENGINEERING_CONTROL_STATE_AUTHORITY_ID=99999999-9999-4999-8999-999999999999
              EOF
              cat > "$STATUS/v5-durable.env" <<'EOF'
              ENGINEERING_CONTROL_DURABLE_KERNEL=dbos
              ENGINEERING_CONTROL_DBOS_SYSTEM_DATABASE_URL=postgresql://ecdbos@127.0.0.1:15447/ecdbos
              ENGINEERING_CONTROL_DBOS_APPLICATION_VERSION=ec-phase9-v5
              EOF
              cat > "$STATUS/run-v5-daemon.sh" <<'EOF'
              #!/bin/bash
              set -euo pipefail
              set -a
              source /home/charles/.config/engineering-control/production.env
              source /home/charles/.local/share/engineering-control/phase9-status/v5-state.env
              source /home/charles/.local/share/engineering-control/phase9-status/v5-durable.env
              set +a
              export ENGINEERING_CONTROL_STATE_DIRECTORY=/home/charles/.local/share/engineering-control/phase9-status/v5-state
              export ENGINEERING_CONTROL_WORKSPACE_DIRECTORY=/home/charles/.local/share/engineering-control/phase9-status/v5-workspaces
              export ENGINEERING_CONTROL_MAX_BACKGROUND_CONCURRENCY=2
              export ENGINEERING_CONTROL_FORGEJO_ENABLED=false
              export ENGINEERING_CONTROL_ROUTING_CONFIG='{"capability":"bounded","nativeCapacityState":"comfortable","native":{"sol":{"model":"gpt-5.6-sol","reasoningEfforts":["medium"],"availability":"unavailable","health":"healthy"}},"kilo":{"availability":"unavailable","health":"healthy"},"source":"phase9 v5 isolated capacity qualification","kiloOffloadStates":[],"codexBudget":{"weeklyTargetPercent":70,"burstTolerancePercent":10}}'
              exec /home/charles/.local/share/mise/installs/node/24.19.0/bin/node /home/charles/Projects/engineering-control/dist/apps/daemon/src/main.js
              EOF
              cat > "$STATUS/run-v5-mcp.sh" <<'EOF'
              #!/bin/bash
              set -euo pipefail
              set -a
              source /home/charles/.local/share/engineering-control/phase9-status/v5-state.env
              set +a
              export EC_MCP_PORT=28788
              exec /home/charles/.local/share/mise/installs/node/24.19.0/bin/node /home/charles/Projects/engineering-control/dist/apps/mcp/src/main.js
              EOF
              cat > "$STATUS/run-v5-inspector.sh" <<'EOF'
              #!/bin/bash
              set -euo pipefail
              set -a
              source /home/charles/.local/share/engineering-control/phase9-status/v5-state.env
              set +a
              export EC_INSPECTOR_PROJECT_ID=engineering-control
              export EC_INSPECTOR_PORT=28789
              export EC_INSPECTOR_TUNNEL_HEALTH_URL=http://127.0.0.1:65534/health
              exec /home/charles/.local/share/mise/installs/node/24.19.0/bin/node /home/charles/.local/lib/engineering-control-inspector/current/dist/apps/inspector/src/main.js
              EOF
              cat > "$STATUS/run-v5-litellm.sh" <<'EOF'
              #!/bin/bash
              set -euo pipefail
              set -a
              source /home/charles/.config/engineering-control/litellm.env
              set +a
              exec /home/charles/.local/lib/engineering-control-litellm/1.104.0/bin/litellm --config /home/charles/Projects/engineering-control/deploy/litellm/config.yaml --host 127.0.0.1 --port 14001
              EOF
              cat > "$STATUS/run-v5-workload.sh" <<'EOF'
              #!/bin/bash
              set -o pipefail
              cd /home/charles/Projects/engineering-control
              /home/charles/.local/share/mise/installs/pnpm/11.23.0/pnpm build &&
              /home/charles/.local/share/mise/installs/pnpm/11.23.0/pnpm typecheck
              rc=$?
              printf '%s\n' "$rc" > /home/charles/.local/share/engineering-control/phase9-status/v5-workload.exit
              exit "$rc"
              EOF
              cat > "$STATUS/cleanup-v5.sh" <<'EOF'
              #!/bin/bash
              set +e
              U=(env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus)
              for unit in phase9-v5-daemon phase9-v5-mcp phase9-v5-inspector phase9-v5-litellm phase9-v5-workload; do
                runuser -u charles -- "${U[@]}" systemctl --user stop "$unit.service" >/dev/null 2>&1 || true
              done
              docker rm -f ec-phase9-v5-pg >/dev/null 2>&1 || true
              date --iso-8601=seconds > /home/charles/.local/share/engineering-control/phase9-status/v5-cleanup.done
              EOF
              chmod 700 "$STATUS"/run-v5-*.sh "$STATUS"/cleanup-v5.sh
              chown -R charles:charles "$STATUS"

              runuser -u charles -- "${U[@]}" systemd-run --user --unit=phase9-v5-daemon --property=MemoryHigh=768M --property=MemoryMax=1024M "$STATUS/run-v5-daemon.sh" >/dev/null
              runuser -u charles -- "${U[@]}" systemd-run --user --unit=phase9-v5-mcp --property=MemoryHigh=384M --property=MemoryMax=512M "$STATUS/run-v5-mcp.sh" >/dev/null
              runuser -u charles -- "${U[@]}" systemd-run --user --unit=phase9-v5-inspector --property=MemoryHigh=384M --property=MemoryMax=512M "$STATUS/run-v5-inspector.sh" >/dev/null
              runuser -u charles -- "${U[@]}" systemd-run --user --unit=phase9-v5-litellm --property=MemoryHigh=384M --property=MemoryMax=512M "$STATUS/run-v5-litellm.sh" >/dev/null
              runuser -u charles -- "${U[@]}" systemd-run --user --unit=phase9-v5-workload --property=MemoryHigh=768M --property=MemoryMax=1024M "$STATUS/run-v5-workload.sh" >/dev/null

              for port in 3000 28788 28789 14001; do
                ok=0
                for i in $(seq 1 90); do
                  ss -H -ltn | awk '{print $4}' | grep -Eq "(^|:)${port}$" && { ok=1; break; }
                  sleep 1
                done
                [ "$ok" = 1 ] || { echo "port ${port} not ready" > "$STATUS/qualification-v5.FAIL"; exit 2; }
              done
              for unit in phase9-v5-daemon phase9-v5-mcp phase9-v5-inspector phase9-v5-litellm; do
                runuser -u charles -- "${U[@]}" systemctl --user is-active --quiet "$unit.service" || {
                  echo "$unit not active" > "$STATUS/qualification-v5.FAIL"; exit 2;
                }
              done
              free -m > "$STATUS/v5-memory-baseline.txt"
              cat /proc/meminfo > "$STATUS/v5-meminfo-baseline.txt"
              date --iso-8601=seconds > "$STATUS/v5.ready"
              systemd-run --unit=phase9-v5-cleanup --on-active=15m /bin/bash "$STATUS/cleanup-v5.sh" >/dev/null
              HOST
          volumeMounts:
            - name: host-root
              mountPath: /host
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-capacity-monitor-v5
  namespace: networking
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: phase9-capacity-monitor-v5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-capacity-monitor-v5
    spec:
      restartPolicy: Never
      serviceAccountName: phase9-observer
      hostPID: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: monitor
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import datetime, json, os, ssl, time, urllib.request
              status="/hoststatus"
              ready=status+"/v5.ready"
              for _ in range(120):
                  if os.path.exists(ready):
                      break
                  time.sleep(2)
              if not os.path.exists(ready):
                  raise SystemExit("v5 readiness sentinel missing")
              root="https://%s:%s"%(os.environ["KUBERNETES_SERVICE_HOST"],os.environ["KUBERNETES_SERVICE_PORT_HTTPS"])
              token=open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ctx=ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
              headers={"Authorization":"Bearer "+token}
              def api(path):
                  req=urllib.request.Request(root+path,headers=headers)
                  with urllib.request.urlopen(req,context=ctx,timeout=10) as response:
                      return json.load(response)
              def meminfo():
                  data={}
                  for line in open("/proc/meminfo"):
                      key,value,*_=line.replace(":","").split()
                      if key in ("MemAvailable","SwapTotal","SwapFree"):
                          data[key]=int(value)
                  data["SwapUsed"]=data["SwapTotal"]-data["SwapFree"]
                  return data
              def pods():
                  snap={}
                  for p in api("/api/v1/pods").get("items",[]):
                      node=p.get("spec",{}).get("nodeName")
                      if node not in ("k3s-apps-01","k3s-media-01"):
                          continue
                      for c in p.get("status",{}).get("containerStatuses",[]):
                          snap[f"{p['metadata']['namespace']}/{p['metadata']['name']}/{c['name']}"]=c.get("restartCount",0)
                  return snap
              start=datetime.datetime.now(datetime.timezone.utc)
              before=pods()
              m0=meminfo()
              pressure=0
              min_available=m0["MemAvailable"]
              samples=[]
              for _ in range(60):
                  nodes=api("/api/v1/nodes")
                  metrics=api("/apis/metrics.k8s.io/v1beta1/nodes")
                  conditions={}
                  for n in nodes.get("items",[]):
                      name=n["metadata"]["name"]
                      if name in ("k3s-apps-01","k3s-media-01"):
                          conditions[name]={c["type"]:c["status"] for c in n.get("status",{}).get("conditions",[])}
                  if any(v.get("MemoryPressure")=="True" for v in conditions.values()):
                      pressure+=1
                  mi=meminfo()
                  min_available=min(min_available,mi["MemAvailable"])
                  samples.append({"at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"conditions":conditions,"hostMem":mi,"nodeMemory":{x["metadata"]["name"]:x["usage"]["memory"] for x in metrics.get("items",[])}})
                  time.sleep(10)
              after=pods()
              m1=meminfo()
              restart_delta={k:{"before":before.get(k,0),"after":v} for k,v in after.items() if v!=before.get(k,0)}
              bad=[]
              for e in api("/api/v1/events").get("items",[]):
                  stamp=e.get("lastTimestamp") or e.get("eventTime") or e["metadata"].get("creationTimestamp")
                  if not stamp or stamp < start.isoformat().replace("+00:00","Z"):
                      continue
                  reason=(e.get("reason") or "").lower()
                  message=(e.get("message") or "").lower()
                  if any(k in reason or k in message for k in ("oom","evict","memorypressure","out of memory")):
                      bad.append({"namespace":e["metadata"].get("namespace"),"reason":e.get("reason"),"message":e.get("message"),"time":stamp})
              workload=None
              workload_path=status+"/v5-workload.exit"
              if os.path.exists(workload_path):
                  workload=int(open(workload_path).read().strip())
              swap_growth=m1["SwapUsed"]-m0["SwapUsed"]
              summary={"startedAt":start.isoformat(),"finishedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"samples":len(samples),"memoryPressureSamples":pressure,"badEvents":bad,"restartDelta":restart_delta,"initialHostMemKiB":m0,"finalHostMemKiB":m1,"minMemAvailableKiB":min_available,"swapGrowthKiB":swap_growth,"workloadExit":workload}
              open(status+"/qualification-v5-samples.json","w").write(json.dumps(samples,indent=2)+"\n")
              open(status+"/qualification-v5-summary.json","w").write(json.dumps(summary,indent=2)+"\n")
              ok=pressure==0 and not bad and not restart_delta and workload==0 and swap_growth<=32768
              open(status+("/qualification-v5.PASS" if ok else "/qualification-v5.FAIL"),"w").write(json.dumps(summary,indent=2)+"\n")
              if not ok:
                  raise SystemExit("phase9 v5 capacity qualification failed")
          volumeMounts:
            - name: status
              mountPath: /hoststatus
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: status
          hostPath:
            path: /home/charles/.local/share/engineering-control/phase9-status
            type: DirectoryOrCreate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-media-load-v5
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: phase9-media-load-v5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-media-load-v5
    spec:
      restartPolicy: Never
      serviceAccountName: phase9-media-v5
      nodeSelector:
        homelab.charles/pool: media
      containers:
        - name: load
          image: bitnami/kubectl:1.34.1
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: JELLYFIN_API_KEY
          command: ["/bin/sh", "-ec"]
          args:
            - |
              media_pod="$(kubectl -n media get pod -l app=media-stack -o jsonpath='{.items[0].metadata.name}')"
              jellyfin_pod="$(kubectl -n media get pod -l app=jellyfin -o jsonpath='{.items[0].metadata.name}')"
              test -n "$media_pod" && test -n "$jellyfin_pod"

              kubectl -n media exec "$media_pod" -c qbittorrent -- curl -fsS -X POST --data 'hashes=all' http://127.0.0.1:8080/api/v2/torrents/recheck
              echo "qBittorrent full recheck triggered"

              kubectl -n media exec "$media_pod" -c radarr -- sh -ec '
                api="$(sed -n "s:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p" /config/config.xml | head -1)"
                test -n "$api"
                curl -fsS -X POST -H "X-Api-Key: $api" -H "Content-Type: application/json" --data '"'"'{"name":"RescanMovie"}'"'"' http://127.0.0.1:7878/api/v3/command >/dev/null
              '
              echo "Radarr rescan triggered"

              kubectl -n media exec "$media_pod" -c sonarr -- sh -ec '
                api="$(sed -n "s:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p" /config/config.xml | head -1)"
                test -n "$api"
                curl -fsS -X POST -H "X-Api-Key: $api" -H "Content-Type: application/json" --data '"'"'{"name":"RescanSeries"}'"'"' http://127.0.0.1:8989/api/v3/command >/dev/null
              '
              echo "Sonarr rescan triggered"

              kubectl -n media exec "$jellyfin_pod" -c jellyfin -- sh -ec "wget -qO- --method=POST --header='X-Emby-Token: $JELLYFIN_API_KEY' http://127.0.0.1:8096/Library/Refresh >/dev/null"
              echo "Jellyfin library refresh triggered"

              kubectl -n media exec "$jellyfin_pod" -c jellyfin -- sh -ec '
                f="$(find /media /data -type f \( -iname "*.mkv" -o -iname "*.mp4" \) 2>/dev/null | head -1)"
                test -n "$f"
                out=/cache/phase9-v5-transcode.mkv
                rm -f "$out"
                set +e
                timeout 200 /usr/lib/jellyfin-ffmpeg/ffmpeg -re -y -hide_banner -loglevel error -t 180 -i "$f" -vf scale=1280:-2 -c:v libx264 -preset veryfast -c:a aac -f matroska "$out"
                rc=$?
                rm -f "$out"
                [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]
              ' &
              transcode_pid=$!

              for i in $(seq 1 12); do
                kubectl -n media exec "$media_pod" -c qbittorrent -- sh -ec '
                  data="$(curl -fsS http://127.0.0.1:8080/api/v2/torrents/info)"
                  count="$(printf "%s" "$data" | grep -o '"'"'"state":"checking[^"]*"'"' | wc -l)"
                  printf "qBittorrent_checking=%s\n" "$count"
                '
                sleep 30
              done
              wait "$transcode_pid"
              echo "phase9 media load v5 complete"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
