apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase9-observer
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phase9-observer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phase9-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phase9-observer
subjects:
  - kind: ServiceAccount
    name: phase9-observer
    namespace: networking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase9-status
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels: { app: phase9-status }
  template:
    metadata:
      labels: { app: phase9-status }
    spec:
      serviceAccountName: phase9-observer
      hostNetwork: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: status
          image: python:3.13-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /status
              exec python3 -m http.server 18080 --bind 0.0.0.0 --directory /status
          volumeMounts:
            - { name: status, mountPath: /status, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        - name: observer
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import json, os, ssl, time, urllib.request
              root = "/var/run/secrets/kubernetes.io/serviceaccount"
              token = open(root + "/token", encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=root + "/ca.crt")
              base = "https://" + os.environ["KUBERNETES_SERVICE_HOST"] + ":" + os.environ["KUBERNETES_SERVICE_PORT"]
              headers = {"Authorization": "Bearer " + token}
              def get(path):
                  req = urllib.request.Request(base + path, headers=headers)
                  with urllib.request.urlopen(req, context=context, timeout=10) as response:
                      return json.load(response)
              def write(name, value):
                  tmp = "/status/." + name + ".tmp"
                  with open(tmp, "w", encoding="utf-8") as handle:
                      json.dump(value, handle, indent=2)
                      handle.write("\n")
                  os.replace(tmp, "/status/" + name)
              while True:
                  try:
                      write("jobs-live.json", get("/apis/batch/v1/jobs"))
                      write("pods-live.json", get("/api/v1/pods"))
                      write("nodes-live.json", get("/api/v1/nodes"))
                      write("events-live.json", get("/api/v1/events"))
                      try:
                          write("metrics-nodes-live.json", get("/apis/metrics.k8s.io/v1beta1/nodes"))
                      except Exception as error:
                          write("metrics-error.json", {"error": str(error)})
                      pods = get("/api/v1/pods").get("items", [])
                      for pod in pods:
                          name = pod.get("metadata", {}).get("name", "")
                          namespace = pod.get("metadata", {}).get("namespace", "default")
                          if "phase9" not in name.lower():
                              continue
                          try:
                              req = urllib.request.Request(
                                  base + "/api/v1/namespaces/" + namespace + "/pods/" + name + "/log?timestamps=true",
                                  headers=headers,
                              )
                              with urllib.request.urlopen(req, context=context, timeout=10) as response:
                                  data = response.read().decode("utf-8", errors="replace")
                              with open("/status/log-" + namespace + "-" + name + ".txt", "w", encoding="utf-8") as handle:
                                  handle.write(data)
                          except Exception as error:
                              with open("/status/log-" + namespace + "-" + name + ".error.txt", "w", encoding="utf-8") as handle:
                                  handle.write(str(error) + "\n")
                      with open("/status/observer-time.txt", "w", encoding="utf-8") as handle:
                          handle.write(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()) + "\n")
                  except Exception as error:
                      write("observer-error.json", {"error": str(error)})
                  time.sleep(10)
          volumeMounts:
            - { name: status, mountPath: /status }
          resources:
            requests: { cpu: 5m, memory: 20Mi }
            limits: { cpu: 100m, memory: 96Mi }
      volumes:
        - name: status
          hostPath:
            path: /home/charles/.local/share/engineering-control/phase9-status
            type: DirectoryOrCreate
