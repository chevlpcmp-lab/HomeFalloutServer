apiVersion: batch/v1
kind: Job
metadata:
  name: windmill-ssh-recovery
  namespace: networking
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: windmill-ssh-recovery
    spec:
      restartPolicy: Never
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: recovery
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: WINDMILL_PUBKEY
              value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICjXrErgbakCEMB7Q43F5EIEiCJmOBTRQDMZ9KeUQqKk chevlpcmp@gmail.com"
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /host-ssh
              touch /host-ssh/authorized_keys
              grep -qxF "$WINDMILL_PUBKEY" /host-ssh/authorized_keys || printf "%s\n" "$WINDMILL_PUBKEY" >> /host-ssh/authorized_keys
              chmod 700 /host-ssh
              chmod 600 /host-ssh/authorized_keys
              owner_uid="$(stat -c %u /host-ssh)"
              owner_gid="$(stat -c %g /host-ssh)"
              chown "$owner_uid:$owner_gid" /host-ssh/authorized_keys
              echo "WINDMILL SSH key installed"
          volumeMounts:
            - name: host-ssh
              mountPath: /host-ssh
      volumes:
        - name: host-ssh
          hostPath:
            path: /home/charles/.ssh
            type: DirectoryOrCreate
