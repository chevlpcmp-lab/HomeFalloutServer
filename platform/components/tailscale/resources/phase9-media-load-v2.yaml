apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase9-media-load-v2
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase9-media-load-v2
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase9-media-load-v2
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase9-media-load-v2
subjects:
  - kind: ServiceAccount
    name: phase9-media-load-v2
    namespace: media
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-media-load-v2-20261005
  namespace: media
  labels:
    app.kubernetes.io/name: phase9-media-load-v2
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-media-load-v2
    spec:
      restartPolicy: Never
      serviceAccountName: phase9-media-load-v2
      nodeSelector:
        homelab.charles/pool: media
      containers:
        - name: load
          image: bitnami/kubectl:1.34.1
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: JELLYFIN_API_KEY
          command: ["/bin/sh", "-ec"]
          args:
            - |
              media_pod="$(kubectl -n media get pod -l app=media-stack -o jsonpath='{.items[0].metadata.name}')"
              jellyfin_pod="$(kubectl -n media get pod -l app=jellyfin -o jsonpath='{.items[0].metadata.name}')"
              test -n "$media_pod"
              test -n "$jellyfin_pod"

              kubectl -n media exec "$media_pod" -c qbittorrent --                 curl -fsS -X POST --data 'hashes=all'                 http://127.0.0.1:8080/api/v2/torrents/recheck
              echo "qBittorrent full recheck triggered"

              kubectl -n media exec "$media_pod" -c radarr -- sh -ec '
                api="$(sed -n "s:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p" /config/config.xml | head -1)"
                test -n "$api"
                curl -fsS -X POST -H "X-Api-Key: $api" -H "Content-Type: application/json"                   --data '"'"'{"name":"RescanMovie"}'"'"'                   http://127.0.0.1:7878/api/v3/command >/tmp/phase9-radarr-command.json
              '
              echo "Radarr rescan triggered"

              kubectl -n media exec "$media_pod" -c sonarr -- sh -ec '
                api="$(sed -n "s:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p" /config/config.xml | head -1)"
                test -n "$api"
                curl -fsS -X POST -H "X-Api-Key: $api" -H "Content-Type: application/json"                   --data '"'"'{"name":"RescanSeries"}'"'"'                   http://127.0.0.1:8989/api/v3/command >/tmp/phase9-sonarr-command.json
              '
              echo "Sonarr rescan triggered"

              kubectl -n media exec "$jellyfin_pod" -c jellyfin -- sh -ec                 "wget -qO- --method=POST --header='X-Emby-Token: $JELLYFIN_API_KEY' http://127.0.0.1:8096/Library/Refresh >/dev/null"
              echo "Jellyfin library refresh triggered"

              for i in $(seq 1 14); do
                kubectl -n media exec "$media_pod" -c qbittorrent -- sh -ec '
                  data="$(curl -fsS http://127.0.0.1:8080/api/v2/torrents/info)"
                  count="$(printf "%s" "$data" | grep -o '"'"'"state":"checking[^"]*"'"' | wc -l)"
                  printf "qBittorrent_checking=%s\n" "$count"
                '
                sleep 30
              done
              echo "phase9 media load v2 complete"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
