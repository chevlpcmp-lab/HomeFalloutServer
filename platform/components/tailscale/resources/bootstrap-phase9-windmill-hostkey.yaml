apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-phase9-windmill-hostkey
  namespace: networking
  labels:
    app.kubernetes.io/name: bootstrap-phase9-windmill-hostkey
    app.kubernetes.io/part-of: homefallout-recovery
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-phase9-windmill-hostkey
    spec:
      restartPolicy: Never
      hostNetwork: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: repair
          image: alpine:3.20
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache openssh-client >/dev/null
              key="$(ssh-keyscan -T 8 -p 2222 -t ed25519 100.114.95.97 2>/dev/null | awk 'NF >= 3 {print $2 " " $3; exit}')"
              test -n "$key"
              uid="$(awk -F: '$1 == "charles" { print $3 }' /host/etc/passwd)"
              gid="$(awk -F: '$1 == "charles" { print $4 }' /host/etc/passwd)"
              test -n "$uid" && test -n "$gid"
              mkdir -p /host/home/charles/.ssh
              touch /host/home/charles/.ssh/authorized_keys
              line="$key phase9-windmill-hostkey"
              grep -qxF "$line" /host/home/charles/.ssh/authorized_keys || printf '%s\n' "$line" >> /host/home/charles/.ssh/authorized_keys
              chown -R "$uid:$gid" /host/home/charles/.ssh
              chmod 700 /host/home/charles/.ssh
              chmod 600 /host/home/charles/.ssh/authorized_keys
              printf 'bootstrap-phase9-windmill-hostkey complete\n'
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
