apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-restore-operator-surface-v1
  namespace: networking
  labels:
    app.kubernetes.io/name: phase9-restore-operator-surface
    app.kubernetes.io/part-of: homefallout-recovery
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-restore-operator-surface
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: restore
          image: alpine:3.20
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache util-linux >/dev/null
              nsenter -t 1 -m -u -i -n -p -- chroot /host /bin/bash -lc '
                set -e
                runuser -u charles -- env                   XDG_RUNTIME_DIR=/run/user/1000                   DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus                   systemctl --user start                     engineering-control-inspector.service                     engineering-control-mcp.service                     engineering-control-tunnel.service                     engineering-control-inspector-tunnel.service
                runuser -u charles -- env                   XDG_RUNTIME_DIR=/run/user/1000                   DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus                   systemctl --user is-active                     engineering-control-inspector.service                     engineering-control-mcp.service                     engineering-control-tunnel.service                     engineering-control-inspector-tunnel.service
                test "$(runuser -u charles -- env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus systemctl --user is-active engineering-control-daemon.service 2>/dev/null || true)" != active
                test "$(runuser -u charles -- env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus systemctl --user is-active engineering-control-bootstrap-reconcile.timer 2>/dev/null || true)" != active
              '
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
