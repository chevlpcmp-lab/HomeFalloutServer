apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-windmill-ssh-rerun-20260928
  namespace: networking
  labels:
    app.kubernetes.io/name: bootstrap-windmill-ssh-rerun-20260928
    app.kubernetes.io/part-of: homefallout-recovery
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-windmill-ssh-rerun-20260928
    spec:
      restartPolicy: Never
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: repair
          image: alpine:3.20
          securityContext:
            runAsUser: 0
          env:
            - name: WINDMILL_PUBLIC_KEY
              value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICjXrErgbakCEMB7Q43F5EIEiCJmOBTRQDMZ9KeUQqKk chevlpcmp@gmail.com"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              uid="$(awk -F: '$1 == "charles" { print $3 }' /host/etc/passwd)"
              gid="$(awk -F: '$1 == "charles" { print $4 }' /host/etc/passwd)"
              test -n "$uid" && test -n "$gid"
              mkdir -p /host/home/charles/.ssh
              touch /host/home/charles/.ssh/authorized_keys
              grep -qxF "$WINDMILL_PUBLIC_KEY" /host/home/charles/.ssh/authorized_keys || printf '%s\n' "$WINDMILL_PUBLIC_KEY" >> /host/home/charles/.ssh/authorized_keys
              chown -R "$uid:$gid" /host/home/charles/.ssh
              chmod 700 /host/home/charles/.ssh
              chmod 600 /host/home/charles/.ssh/authorized_keys
              printf 'bootstrap-windmill-ssh complete\n'
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
