apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase9-capacity-monitor
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phase9-capacity-monitor
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phase9-capacity-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phase9-capacity-monitor
subjects:
  - kind: ServiceAccount
    name: phase9-capacity-monitor
    namespace: networking
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-capacity-monitor-20261005
  namespace: networking
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-capacity-monitor
    spec:
      restartPolicy: Never
      serviceAccountName: phase9-capacity-monitor
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: monitor
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import datetime, json, os, ssl, time, urllib.request

              root = "https://%s:%s" % (
                  os.environ["KUBERNETES_SERVICE_HOST"],
                  os.environ["KUBERNETES_SERVICE_PORT_HTTPS"],
              )
              token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              ctx = ssl.create_default_context(cafile=ca)
              out = "/hostout"
              os.makedirs(out, exist_ok=True)

              def api(path):
                  req = urllib.request.Request(root + path, headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as response:
                      return json.load(response)

              def pods():
                  data = api("/api/v1/pods")
                  snap = {}
                  for p in data.get("items", []):
                      ns = p["metadata"]["namespace"]
                      name = p["metadata"]["name"]
                      node = p.get("spec", {}).get("nodeName")
                      if node not in ("k3s-apps-01", "k3s-media-01"):
                          continue
                      for c in p.get("status", {}).get("containerStatuses", []):
                          snap[f"{ns}/{name}/{c['name']}"] = {
                              "node": node,
                              "restarts": c.get("restartCount", 0),
                              "ready": c.get("ready", False),
                              "state": c.get("state", {}),
                          }
                  return snap

              start = datetime.datetime.now(datetime.timezone.utc)
              first_pods = pods()
              pressure_samples = 0
              samples = 0
              with open(out + "/monitor.jsonl", "w") as f:
                  for _ in range(60):
                      nodes = api("/api/v1/nodes")
                      metrics = api("/apis/metrics.k8s.io/v1beta1/nodes")
                      mem = {x["metadata"]["name"]: x["usage"]["memory"] for x in metrics.get("items", [])}
                      conditions = {}
                      for n in nodes.get("items", []):
                          name = n["metadata"]["name"]
                          if name not in ("k3s-apps-01", "k3s-media-01"):
                              continue
                          conditions[name] = {c["type"]: c["status"] for c in n.get("status", {}).get("conditions", [])}
                      if any(v.get("MemoryPressure") == "True" for v in conditions.values()):
                          pressure_samples += 1
                      sample = {
                          "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          "memory": mem,
                          "conditions": conditions,
                      }
                      f.write(json.dumps(sample) + "\n")
                      f.flush()
                      samples += 1
                      time.sleep(10)

              last_pods = pods()
              events = api("/api/v1/events")
              bad = []
              for e in events.get("items", []):
                  reason = (e.get("reason") or "").lower()
                  message = (e.get("message") or "").lower()
                  if any(k in reason or k in message for k in ("oom", "evict", "memorypressure", "out of memory")):
                      bad.append({
                          "namespace": e["metadata"].get("namespace"),
                          "reason": e.get("reason"),
                          "message": e.get("message"),
                          "time": e.get("lastTimestamp") or e.get("eventTime") or e["metadata"].get("creationTimestamp"),
                      })
              restart_delta = {}
              for k, v in last_pods.items():
                  before = first_pods.get(k, {}).get("restarts", 0)
                  if v["restarts"] != before:
                      restart_delta[k] = {"before": before, "after": v["restarts"], "state": v["state"]}
              summary = {
                  "startedAt": start.isoformat(),
                  "finishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "samples": samples,
                  "memoryPressureSamples": pressure_samples,
                  "badEvents": bad,
                  "restartDelta": restart_delta,
                  "finalPods": last_pods,
              }
              open(out + "/summary.json", "w").write(json.dumps(summary, indent=2) + "\n")
          volumeMounts:
            - name: out
              mountPath: /hostout
      volumes:
        - name: out
          hostPath:
            path: /var/lib/phase9-capacity
            type: DirectoryOrCreate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-capacity-media-20261005
  namespace: media
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-capacity-media
    spec:
      restartPolicy: Never
      nodeSelector:
        homelab.charles/pool: media
      containers:
        - name: load
          image: python:3.13-alpine
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: apps-admin
                  key: USERNAME
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: apps-admin
                  key: PASSWORD
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: JELLYFIN_API_KEY
          command: ["python3", "-c"]
          args:
            - |
              import http.cookiejar, json, os, time, urllib.parse, urllib.request
              import xml.etree.ElementTree as ET

              def key(path):
                  return ET.parse(path).getroot().findtext("ApiKey")

              def post_json(url, payload, api_key=None):
                  headers = {"Content-Type": "application/json"}
                  if api_key:
                      headers["X-Api-Key"] = api_key
                  req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method="POST")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.read()

              jar = http.cookiejar.CookieJar()
              qbt = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              login = urllib.parse.urlencode({
                  "username": os.environ["ADMIN_USER"],
                  "password": os.environ["ADMIN_PASS"],
              }).encode()
              req = urllib.request.Request(
                  "http://qbittorrent.media.svc.cluster.local/api/v2/auth/login",
                  data=login,
                  headers={"Referer": "http://qbittorrent.media.svc.cluster.local/"},
              )
              with qbt.open(req, timeout=20) as response:
                  if response.read().decode().strip() != "Ok.":
                      raise RuntimeError("qBittorrent login failed")
              data = urllib.parse.urlencode({"hashes": "all"}).encode()
              qbt.open(urllib.request.Request(
                  "http://qbittorrent.media.svc.cluster.local/api/v2/torrents/recheck",
                  data=data,
                  headers={"Referer": "http://qbittorrent.media.svc.cluster.local/"},
              ), timeout=20).read()

              radarr_key = key("/radarr/config.xml")
              sonarr_key = key("/sonarr/config.xml")
              post_json("http://radarr.media.svc.cluster.local/api/v3/command", {"name": "RescanMovie"}, radarr_key)
              post_json("http://sonarr.media.svc.cluster.local/api/v3/command", {"name": "RescanSeries"}, sonarr_key)

              jf = urllib.request.Request(
                  "http://jellyfin.media.svc.cluster.local:8096/Library/Refresh?api_key=" + urllib.parse.quote(os.environ["JELLYFIN_API_KEY"]),
                  data=b"",
                  method="POST",
              )
              urllib.request.urlopen(jf, timeout=20).read()
              print("phase9 media load triggered: qBittorrent recheck + Radarr/Sonarr rescans + Jellyfin refresh", flush=True)
              time.sleep(420)
          volumeMounts:
            - name: radarr
              mountPath: /radarr
              readOnly: true
            - name: sonarr
              mountPath: /sonarr
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: radarr
          persistentVolumeClaim:
            claimName: config-radarr
        - name: sonarr
          persistentVolumeClaim:
            claimName: config-sonarr
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-capacity-log-collector-20261005
  namespace: networking
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: phase9-capacity-monitor
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: collect
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import json, os, ssl, urllib.parse, urllib.request
              root = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT_HTTPS"])
              token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
              def get(path):
                  req = urllib.request.Request(root + path, headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as response:
                      return response.read()
              selector = urllib.parse.quote("app.kubernetes.io/name=phase9-capacity-media")
              pods = json.loads(get("/api/v1/namespaces/media/pods?labelSelector=" + selector))
              items = sorted(pods.get("items", []), key=lambda x: x["metadata"].get("creationTimestamp", ""))
              if not items:
                  raise RuntimeError("capacity media pod not found")
              pod = items[-1]
              name = pod["metadata"]["name"]
              os.makedirs("/hostout", exist_ok=True)
              open("/hostout/media-load-status.json", "wb").write(json.dumps(pod["status"], indent=2).encode())
              log = get("/api/v1/namespaces/media/pods/" + name + "/log?container=load")
              open("/hostout/media-load.log", "wb").write(log)
              print(name)
          volumeMounts:
            - name: out
              mountPath: /hostout
      volumes:
        - name: out
          hostPath:
            path: /var/lib/phase9-capacity
            type: DirectoryOrCreate
