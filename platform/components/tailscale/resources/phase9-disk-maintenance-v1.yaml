apiVersion: batch/v1
kind: Job
metadata:
  name: phase9-disk-maintenance-v1
  namespace: networking
  labels:
    app.kubernetes.io/name: phase9-disk-maintenance
    app.kubernetes.io/part-of: phase9-qualification
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase9-disk-maintenance
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        homelab.charles/pool: apps
      containers:
        - name: maintenance
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache util-linux >/dev/null
              nsenter -t 1 -m -n chroot /host /bin/bash <<'HOST'
              set -euo pipefail
              STATUS=/home/charles/.local/share/engineering-control/phase9-status
              mkdir -p "$STATUS"
              OUT="$STATUS/disk-maintenance-v1.txt"
              {
                echo "started=$(date --iso-8601=seconds)"
                echo "before:"
                df -h /
                echo "k3s_before:"
                du -sh /var/lib/rancher/k3s 2>/dev/null || true
                echo "docker_before:"
                docker system df 2>/dev/null || true

                echo "k3s_image_prune:"
                /usr/local/bin/k3s crictl rmi --prune 2>&1 || true
                echo "docker_image_prune:"
                docker image prune -f 2>&1 || true
                apt-get clean || true
                rm -rf /var/lib/apt/lists/*

                echo "after:"
                df -h /
                echo "k3s_after:"
                du -sh /var/lib/rancher/k3s 2>/dev/null || true
                echo "docker_after:"
                docker system df 2>/dev/null || true
                echo "finished=$(date --iso-8601=seconds)"
              } > "$OUT" 2>&1
              chown charles:charles "$OUT"
              HOST
          volumeMounts:
            - name: host-root
              mountPath: /host
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
