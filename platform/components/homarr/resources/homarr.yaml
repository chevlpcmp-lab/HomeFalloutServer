apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-homarr
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: config-local-retain
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: media
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: homarr }
  template:
    metadata:
      labels: { app: homarr }
    spec:
      nodeSelector:
        homelab.charles/pool: converged
      securityContext:
        fsGroup: 1000
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:latest
          env:
            - { name: TZ, value: America/Toronto }
            - name: SECRET_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: homarr-secrets, key: SECRET_ENCRYPTION_KEY } }
          ports: [{ name: http, containerPort: 7575 }]
          startupProbe: { tcpSocket: { port: 7575 }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { tcpSocket: { port: 7575 }, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /appdata }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: config-homarr } }
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: media
  annotations: { metallb.io/loadBalancerIPs: "10.0.0.220" }
spec:
  type: LoadBalancer
  selector: { app: homarr }
  ports: [{ name: http, port: 80, targetPort: 7575 }]
