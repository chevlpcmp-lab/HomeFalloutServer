# Config PVCs dynamically provision under k3s storage on each worker's Proxmox
# `local`-backed OS disk.
# Bulk media/photo PV capacities are binding metadata, not quotas; both directories
# share the separate 600 GB `local-lvm` disk mounted at /mnt/data.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: config-local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: media-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: photos-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-local
  local:
    path: /mnt/data/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k3s-media-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: media-local
  volumeName: media-data
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photos-data
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: photos-local
  local:
    path: /mnt/data/photos
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k3s-media-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photos-data
  namespace: photos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: photos-local
  volumeName: photos-data
  resources:
    requests:
      storage: 500Gi
