apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-stack
  namespace: media
  labels:
    app: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media-stack
  template:
    metadata:
      labels:
        app: media-stack
    spec:
      nodeSelector:
        homelab.charles/pool: media
      securityContext:
        fsGroup: 1000

      # A restartable init container is a Kubernetes-native sidecar. Its startup probe
      # must pass before the app containers start, preventing clear-net startup leaks.
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1
          restartPolicy: Always
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - name: VPN_SERVICE_PROVIDER
              valueFrom: { secretKeyRef: { name: gluetun-vpn, key: VPN_SERVICE_PROVIDER } }
            - name: VPN_TYPE
              valueFrom: { secretKeyRef: { name: gluetun-vpn, key: VPN_TYPE } }
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: gluetun-vpn, key: WIREGUARD_PRIVATE_KEY } }
            - name: SERVER_COUNTRIES
              valueFrom: { secretKeyRef: { name: gluetun-vpn, key: SERVER_COUNTRIES } }
            - name: TZ
              value: America/Toronto
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: :8000
            # Proton assigns a new incoming port when the tunnel reconnects. Gluetun
            # obtains it through NAT-PMP and immediately tells qBittorrent to listen on
            # that exact port. qBittorrent's localhost authentication bypass is used;
            # the WebUI is not exposed through the forwarded VPN port.
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: protonvpn
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data
                "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: FIREWALL_INPUT_PORTS
              value: "5055,6246,6767,7878,8000,8080,8090,8191,8989,9696"
            # These private ranges bypass the VPN so LAN clients and Kubernetes probes
            # can reach the UIs. All public destinations still use the tunnel.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/24,10.42.0.0/16,10.43.0.0/16"
          startupProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }

        # Gluetun updates qBittorrent's Proton-assigned port through the local API.
        # Only localhost bypasses authentication; the LAN WebUI still requires it.
        - name: configure-qbittorrent-local-api
          image: busybox:1.37
          command:
            - /bin/sh
            - -ec
            - |
              conf=/config/qBittorrent/qBittorrent.conf
              temp="${conf}.tmp"
              mkdir -p "$(dirname "$conf")"
              touch "$conf"
              awk '
                BEGIN { in_preferences=0; inserted=0; saw_preferences=0 }
                $0 == "[Preferences]" {
                  in_preferences=1; saw_preferences=1; print; next
                }
                /^\[/ {
                  if (in_preferences && !inserted) {
                    print "WebUI\\LocalHostAuth=false"; inserted=1
                  }
                  in_preferences=0
                }
                index($0, "WebUI\\LocalHostAuth=") == 1 {
                  if (in_preferences && !inserted) {
                    print "WebUI\\LocalHostAuth=false"; inserted=1
                  }
                  next
                }
                { print }
                END {
                  if (!saw_preferences) {
                    print "[Preferences]"
                    print "WebUI\\LocalHostAuth=false"
                  } else if (in_preferences && !inserted) {
                    print "WebUI\\LocalHostAuth=false"
                  }
                }
              ' "$conf" > "$temp"
              mv "$temp" "$conf"
              chown -R 1000:1000 /config
          volumeMounts:
            - { name: config-qbittorrent, mountPath: /config }

        # Mylar3 keeps every setting in config.ini and has no settings API, so its
        # Git-owned configuration is asserted here before the app starts. The API
        # key is generated once and then preserved so Prowlarr and the bootstrap
        # keep authenticating across restarts. UI edits to these keys revert on
        # the next pod restart - change them here instead.
        - name: configure-mylar
          image: python:3.13-slim
          command:
            - /usr/local/bin/python3
            - -c
            - |
              import configparser, os, pathlib, secrets

              # The LinuxServer image starts Mylar with --datadir /config/mylar,
              # so the real config.ini lives one level below the volume root.
              path = pathlib.Path("/config/mylar/config.ini")
              path.parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path("/config/config.ini").unlink(missing_ok=True)
              cfg = configparser.RawConfigParser()
              if path.exists():
                  cfg.read(path)

              def ensure(section, values):
                  if not cfg.has_section(section):
                      cfg.add_section(section)
                  for key, value in values.items():
                      cfg.set(section, key, str(value))

              api_key = ""
              if cfg.has_option("API", "api_key"):
                  api_key = cfg.get("API", "api_key")
              # Mylar serializes an unset key as the literal string "None".
              if api_key in ("", "None"):
                  api_key = secrets.token_hex(16)
              ensure("API", {"api_enabled": True, "api_key": api_key})

              comicvine = os.environ.get("COMICVINE_API_KEY", "")
              if comicvine:
                  ensure("CV", {"comicvine_api": comicvine})
              else:
                  print("configure-mylar: COMICVINE_API_KEY not set - searches will fail until sealed", flush=True)

              admin_user = os.environ.get("ADMIN_USER", "")
              admin_pass = os.environ.get("ADMIN_PASS", "")
              if admin_user and admin_pass:
                  # 2 = forms login. API-key access is unaffected.
                  ensure("Interface", {"authentication": 2,
                                       "http_username": admin_user,
                                       "http_password": admin_pass})

              ensure("General", {
                  "destination_dir": "/data/library/comics",
                  "create_folders": True,
                  # New and upcoming issues of every monitored series are wanted
                  # automatically - the weekly pull-list grabs them unattended.
                  "autowant_upcoming": True,
                  # Writes series.json beside each series; Komga imports it.
                  "series_metadata_local": True,
                  "rename_files": True,
                  "folder_format": "$Series ($Year)",
                  "file_format": "$Series $Annual $Issue ($Year)",
              })
              ensure("PostProcess", {
                  "post_processing": True,
                  # Library and downloads share one filesystem; hardlinks keep
                  # torrents seeding without a second copy.
                  "file_opts": "hardlink",
                  # Torrent imports are found by watching the comics category
                  # folder - Mylar has no completed-download-handling like the Arrs.
                  "enable_check_folder": True,
                  "check_folder": "/data/downloads/complete/comics",
              })
              ensure("Client", {"torrent_downloader": 5})  # 5 = qBittorrent
              ensure("qBittorrent", {
                  # Same pod: localhost bypasses qBittorrent auth either way.
                  "qbittorrent_host": "localhost:8080",
                  "qbittorrent_username": admin_user,
                  "qbittorrent_password": admin_pass,
                  "qbittorrent_label": "comics",
              })
              ensure("Torrents", {
                  "enable_torrents": True,
                  "enable_torrent_search": True,
                  "minseeds": 1,
              })
              # Prowlarr's Mylar application sync manages the torznab list itself.
              ensure("Torznab", {"enable_torznab": True})
              ensure("DDL", {
                  # GetComics direct downloads: the reliable comics source when
                  # torrent indexers come up empty. Rides the pod VPN like all
                  # other egress, and FlareSolverr (same pod) clears Cloudflare.
                  "enable_ddl": True,
                  "enable_getcomics": True,
                  "ddl_location": "/data/downloads/ddl",
                  "enable_flaresolverr": True,
                  "flaresolverr_url": "http://localhost:8191",
              })
              ensure("Metatagging", {
                  # ComicTagger writes ComicInfo.xml into each cbz on import, so
                  # Komga gets real metadata instead of filename guesses.
                  "enable_meta": True,
                  "ct_tag_cr": True,
              })

              with path.open("w") as handle:
                  cfg.write(handle)
              os.chown("/config", 1000, 1000)
              os.chown(path.parent, 1000, 1000)
              os.chown(path, 1000, 1000)
              print("configure-mylar: Git-owned config.ini asserted", flush=True)
          env:
            - name: COMICVINE_API_KEY
              valueFrom:
                secretKeyRef: { name: comicvine, key: COMICVINE_API_KEY, optional: true }
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: { name: apps-admin, key: USERNAME, optional: true }
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef: { name: apps-admin, key: PASSWORD, optional: true }
          volumeMounts:
            - { name: config-mylar, mountPath: /config }

      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.3.0.10514-ls311
          env: &lsio-env
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Toronto }
          ports: [{ name: radarr, containerPort: 7878 }]
          startupProbe: { tcpSocket: { port: 7878 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-radarr, mountPath: /config }
            - { name: media-data, mountPath: /data }
          resources: &arr-resources
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }

        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
          env: *lsio-env
          ports: [{ name: sonarr, containerPort: 8989 }]
          startupProbe: { tcpSocket: { port: 8989 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-sonarr, mountPath: /config }
            - { name: media-data, mountPath: /data }
          resources: *arr-resources

        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls154
          env: *lsio-env
          ports: [{ name: prowlarr, containerPort: 9696 }]
          startupProbe: { tcpSocket: { port: 9696 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-prowlarr, mountPath: /config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }

        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls468
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Toronto }
            - { name: WEBUI_PORT, value: "8080" }
          ports:
            - { name: qbit-ui, containerPort: 8080 }
          startupProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-qbittorrent, mountPath: /config }
            - { name: media-data, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }

        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: TZ, value: America/Toronto }
          ports: [{ name: flaresolverr, containerPort: 8191 }]
          startupProbe: { tcpSocket: { port: 8191 }, periodSeconds: 5, failureThreshold: 30 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }

        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env: *lsio-env
          ports: [{ name: bazarr, containerPort: 6767 }]
          startupProbe: { tcpSocket: { port: 6767 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-bazarr, mountPath: /config }
            - { name: media-data, mountPath: /data }
          resources: *arr-resources

        - name: mylar
          image: lscr.io/linuxserver/mylar3:v0.10.0-ls267
          env: *lsio-env
          ports: [{ name: mylar, containerPort: 8090 }]
          startupProbe: { tcpSocket: { port: 8090 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-mylar, mountPath: /config }
            - { name: media-data, mountPath: /data }
          resources: *arr-resources

        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          env:
            - { name: TZ, value: America/Toronto }
            - { name: PORT, value: "5055" }
          ports: [{ name: seerr, containerPort: 5055 }]
          startupProbe: { tcpSocket: { port: 5055 }, periodSeconds: 5, failureThreshold: 30 }
          volumeMounts:
            - { name: config-seerr, mountPath: /app/config }
          resources: *arr-resources

        # Reconciles the wiring BETWEEN the apps (download clients, Prowlarr sync,
        # FlareSolverr, Bazarr connections, root folders) and provisions Homarr's
        # apps, integrations, and board. It shares this pod's network namespace, so
        # every app is on localhost and qBittorrent's localhost auth bypass applies.
        # Idempotent: re-asserts the wiring on every pod restart.
        - name: bootstrap
          image: python:3.13-slim
          # ConfigMap volumes update in place, but a running Python process does
          # not reload its source. Watch the script digest so every Argo-applied
          # Git change is reconciled automatically without a manual rollout.
          command:
            - /bin/sh
            - -ec
            - |
              last_digest=""
              while true; do
                digest="$(sha256sum /scripts/bootstrap.py | cut -d' ' -f1)"
                if [ "$digest" != "$last_digest" ]; then
                  echo "Bootstrap desired state changed: ${digest}"
                  if python3 /scripts/bootstrap.py; then
                    last_digest="$digest"
                    echo "Bootstrap desired state reconciled: ${digest}"
                  else
                    echo "Bootstrap reconciliation failed; retrying in 60 seconds" >&2
                  fi
                fi
                sleep 60
              done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - { name: TZ, value: America/Toronto }
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: { name: apps-admin, key: USERNAME, optional: true }
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef: { name: apps-admin, key: PASSWORD, optional: true }
            - name: HOMARR_API_KEY
              valueFrom:
                secretKeyRef: { name: homarr-secrets, key: HOMARR_API_KEY, optional: true }
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef: { name: homarr-secrets, key: JELLYFIN_API_KEY, optional: true }
          volumeMounts:
            - { name: bootstrap-script, mountPath: /scripts, readOnly: true }
            - { name: config-radarr, mountPath: /config/radarr, readOnly: true }
            - { name: config-sonarr, mountPath: /config/sonarr, readOnly: true }
            - { name: config-prowlarr, mountPath: /config/prowlarr, readOnly: true }
            - { name: config-bazarr, mountPath: /config/bazarr, readOnly: true }
            - { name: config-seerr, mountPath: /config/seerr, readOnly: true }
            - { name: config-mylar, mountPath: /config/mylar, readOnly: true }
            - { name: media-data, mountPath: /data }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }

        - name: maintainerr
          image: ghcr.io/maintainerr/maintainerr:latest
          env:
            - { name: TZ, value: America/Toronto }
          ports: [{ name: maintainerr, containerPort: 6246 }]
          startupProbe: { tcpSocket: { port: 6246 }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /api/health/ready, port: 6246 }, periodSeconds: 15 }
          volumeMounts:
            - { name: config-maintainerr, mountPath: /opt/data }
          resources: *arr-resources

      volumes:
        - { name: bootstrap-script, configMap: { name: media-stack-bootstrap } }
        - { name: media-data, persistentVolumeClaim: { claimName: media-data } }
        - { name: config-radarr, persistentVolumeClaim: { claimName: config-radarr } }
        - { name: config-sonarr, persistentVolumeClaim: { claimName: config-sonarr } }
        - { name: config-prowlarr, persistentVolumeClaim: { claimName: config-prowlarr } }
        - { name: config-qbittorrent, persistentVolumeClaim: { claimName: config-qbittorrent } }
        - { name: config-bazarr, persistentVolumeClaim: { claimName: config-bazarr } }
        - { name: config-seerr, persistentVolumeClaim: { claimName: config-seerr } }
        - { name: config-maintainerr, persistentVolumeClaim: { claimName: config-maintainerr } }
        - { name: config-mylar, persistentVolumeClaim: { claimName: config-mylar } }
