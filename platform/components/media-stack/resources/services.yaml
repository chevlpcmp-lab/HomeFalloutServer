# Every Service selects the same pod. Kubernetes containers in that pod share Gluetun's
# network namespace, but each LAN UI keeps a memorable dedicated address.
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
  annotations: { metallb.io/loadBalancerIPs: "10.0.0.231" }
spec:
  type: LoadBalancer
  selector: { app: media-stack }
  ports: [{ name: http, port: 80, targetPort: 7878 }]
---
