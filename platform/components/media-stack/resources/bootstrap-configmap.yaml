apiVersion: v1
kind: ConfigMap
metadata:
  name: media-stack-bootstrap
  namespace: media
data:
  bootstrap.py: |
    #!/usr/bin/env python3
    """
    Wires up the media stack after the apps start, then provisions Homarr.

    Runs as a sidecar in the media-stack pod, so every VPN-bound app is reachable on
    localhost and qBittorrent's localhost authentication bypass applies. Homarr and
    Jellyfin run in other pods and are addressed by Service DNS.

    Each app's API key is read straight from its config volume, so nothing has to be
    copied into Secrets by hand. Idempotent - skips anything already configured.

    Homarr provisioning only runs when HOMARR_API_KEY is set (create the admin account,
    then an API key under Management > Tools > API, and reseal homarr-secrets).
    """
    import http.cookiejar, json, os, re, time, urllib.parse, urllib.request, urllib.error, xml.etree.ElementTree as ET

    RADARR_URL   = "http://localhost:7878"
    SONARR_URL   = "http://localhost:8989"
    PROWLARR_URL = "http://localhost:9696"
    QB_URL       = "http://localhost:8080"
    BAZARR_URL   = "http://localhost:6767"
    FLARE_URL    = "http://localhost:8191"
    SEERR_URL    = "http://localhost:5055"
    MAINTAINERR_URL = "http://localhost:6246"

    HOMARR_URL       = os.environ.get("HOMARR_URL", "http://homarr.media.svc.cluster.local")
    HOMARR_API_KEY   = os.environ.get("HOMARR_API_KEY", "")
    JELLYFIN_API_KEY = os.environ.get("JELLYFIN_API_KEY", "")
    # One shared admin account (apps-admin secret) enforced across every app that
    # supports it: qBittorrent, Radarr, Sonarr, Prowlarr, Bazarr, and Jellyfin.
    # Seerr signs in with Jellyfin, Maintainerr has no login, and Homarr's own
    # admin must be set once by hand (its API cannot reset the key owner's password).
    ADMIN_USER       = os.environ.get("ADMIN_USER", "")
    ADMIN_PASS       = os.environ.get("ADMIN_PASS", "")

    # LAN addresses the dashboard links to (metallb LoadBalancer IPs).
    LAN = {
        "jellyfin":    "http://10.0.0.230:8096",
        "radarr":      "http://10.0.0.231",
        "sonarr":      "http://10.0.0.232",
        "prowlarr":    "http://10.0.0.233",
        "qbittorrent": "http://10.0.0.234",
        "bazarr":      "http://10.0.0.235",
        "seerr":       "http://10.0.0.236",
        "maintainerr": "http://10.0.0.237",
        "immich":      "http://10.0.0.240",
    }
    # Cluster-internal URLs Homarr's server uses for its integrations.
    SVC = {
        "jellyfin":    "http://jellyfin.media.svc.cluster.local:8096",
        "radarr":      "http://radarr.media.svc.cluster.local",
        "sonarr":      "http://sonarr.media.svc.cluster.local",
        "prowlarr":    "http://prowlarr.media.svc.cluster.local",
        "qbittorrent": "http://qbittorrent.media.svc.cluster.local",
        "bazarr":      "http://bazarr.media.svc.cluster.local",
        "seerr":       "http://seerr.media.svc.cluster.local",
    }
    ICONS = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@master"

    # ── generic helpers ───────────────────────────────────────────────────────

    def read_arr_key(path, max_wait=600):
        deadline = time.time() + max_wait
        while time.time() < deadline:
            try:
                key = ET.parse(path).getroot().findtext("ApiKey")
                if key:
                    return key
            except Exception:
                pass
            time.sleep(5)
        raise RuntimeError(f"API key not found in {path} after {max_wait}s")

    def read_bazarr_key(path, max_wait=600):
        # Stdlib-only parse of Bazarr's config.yaml: apikey under the auth: section.
        deadline = time.time() + max_wait
        while time.time() < deadline:
            try:
                section = None
                with open(path) as f:
                    for line in f:
                        top = re.match(r"^(\w[\w-]*):", line)
                        if top:
                            section = top.group(1)
                        m = re.match(r"^\s+apikey:\s*['\"]?([0-9a-fA-F]+)['\"]?\s*$", line)
                        if m and section == "auth":
                            return m.group(1)
            except Exception:
                pass
            time.sleep(5)
        raise RuntimeError(f"Bazarr API key not found in {path} after {max_wait}s")

    def read_seerr_key(path, max_wait=600):
        deadline = time.time() + max_wait
        while time.time() < deadline:
            try:
                with open(path) as f:
                    key = json.load(f).get("main", {}).get("apiKey")
                if key:
                    return key
            except Exception:
                pass
            time.sleep(5)
        raise RuntimeError(f"Seerr API key not found in {path} after {max_wait}s")

    def get(url, api_key):
        req = urllib.request.Request(url, headers={"X-Api-Key": api_key})
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())

    def post(url, api_key, payload):
        data = json.dumps(payload).encode()
        req = urllib.request.Request(url, data=data, method="POST",
            headers={"X-Api-Key": api_key, "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=90) as r:
                content = r.read()
                return json.loads(content) if content else {}
        except urllib.error.HTTPError as e:
            body = e.read().decode(errors="replace")
            print(f"POST {url} -> HTTP {e.code}: {body[:500]}", flush=True)
            raise

    def put(url, api_key, payload):
        data = json.dumps(payload).encode()
        req = urllib.request.Request(url, data=data, method="PUT",
            headers={"X-Api-Key": api_key, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            content = r.read()
            return json.loads(content) if content else {}

    def delete(url, api_key):
        req = urllib.request.Request(url, method="DELETE", headers={"X-Api-Key": api_key})
        with urllib.request.urlopen(req, timeout=10):
            pass

    def json_request(method, url, payload=None, headers=None, opener=None, timeout=90):
        data = json.dumps(payload).encode() if payload is not None else None
        req = urllib.request.Request(url, data=data, method=method,
            headers={"Content-Type": "application/json", **(headers or {})})
        client = opener or urllib.request.build_opener()
        try:
            with client.open(req, timeout=timeout) as r:
                content = r.read()
                return json.loads(content) if content else {}
        except urllib.error.HTTPError as e:
            body = e.read().decode(errors="replace")
            print(f"{method} {url} -> HTTP {e.code}: {body[:500]}", flush=True)
            raise

    def set_fields(fields, values):
        """Return an Arr field list with named values replaced, preserving schema defaults."""
        result = [dict(field) for field in fields]
        by_name = {field.get("name"): field for field in result}
        for name, value in values.items():
            if name in by_name:
                by_name[name]["value"] = value
            else:
                result.append({"name": name, "value": value})
        return result

    def wait_ready(base_url, api_key, name, ver="v3"):
        print(f"Waiting for {name}...", flush=True)
        for _ in range(120):
            try:
                get(f"{base_url}/api/{ver}/system/status", api_key)
                print(f"{name} ready", flush=True)
                return
            except Exception:
                pass
            time.sleep(5)
        raise RuntimeError(f"{name} not ready after 10 minutes")

    # ── qBittorrent (localhost auth bypass, no credentials needed) ────────────

    def configure_qbittorrent():
        print("Waiting for qBittorrent...", flush=True)
        for _ in range(120):
            try:
                urllib.request.urlopen(f"{QB_URL}/", timeout=5)
                break
            except Exception:
                time.sleep(5)
        else:
            raise RuntimeError("qBittorrent not ready after 10 minutes")
        print("qBittorrent ready", flush=True)

        def set_prefs(prefs):
            data = urllib.parse.urlencode({"json": json.dumps(prefs)}).encode()
            urllib.request.urlopen(f"{QB_URL}/api/v2/app/setPreferences", data, timeout=10)

        # Incomplete and complete share the dataset so the completion move is a
        # rename, not a copy. Listen port and interface are owned by Gluetun.
        for d in ["/data/downloads/incomplete", "/data/downloads/complete",
                  "/data/library/movies", "/data/library/tv"]:
            os.makedirs(d, exist_ok=True)
        set_prefs({
            "save_path": "/data/downloads/complete",
            "temp_path_enabled": True,
            "temp_path": "/data/downloads/incomplete",
        })
        print("qBittorrent: save=/data/downloads/complete temp=/data/downloads/incomplete", flush=True)

        # Sync the WebUI credentials from the shared admin secret so LAN browser
        # logins are deterministic instead of the random password qBittorrent
        # generates. Localhost callers bypass auth either way.
        if ADMIN_USER and ADMIN_PASS:
            set_prefs({"web_ui_username": ADMIN_USER, "web_ui_password": ADMIN_PASS})
            print("qBittorrent: WebUI credentials synced from apps-admin secret", flush=True)
        else:
            print("qBittorrent: no apps-admin secret - WebUI password left as-is", flush=True)

        # Keep the category labels (Radarr/Sonarr identify downloads by them) but
        # point both at the flat complete dir - no per-category subfolders.
        for cat in ["radarr", "sonarr"]:
            form = urllib.parse.urlencode({"category": cat, "savePath": "/data/downloads/complete"}).encode()
            try:
                urllib.request.urlopen(f"{QB_URL}/api/v2/torrents/createCategory", form, timeout=10)
                print(f"qBittorrent: category '{cat}' created", flush=True)
            except urllib.error.HTTPError as e:
                if e.code != 409:
                    raise
                urllib.request.urlopen(f"{QB_URL}/api/v2/torrents/editCategory", form, timeout=10)
                print(f"qBittorrent: category '{cat}' updated", flush=True)

    # ── Radarr / Sonarr / Prowlarr ────────────────────────────────────────────

    def add_root_folder(base_url, api_key, app, path):
        folders = get(f"{base_url}/api/v3/rootfolder", api_key)
        if any(f.get("path") == path for f in folders):
            print(f"{app}: root folder {path} already configured", flush=True)
            return
        try:
            post(f"{base_url}/api/v3/rootfolder", api_key, {"path": path})
            print(f"{app}: root folder {path} added", flush=True)
        except urllib.error.HTTPError as e:
            print(f"WARNING: {app}: root folder {path} failed (HTTP {e.code}) - check permissions", flush=True)

    def add_qbittorrent_client(base_url, api_key, app):
        clients = get(f"{base_url}/api/v3/downloadclient", api_key)
        existing = next((c for c in clients if c.get("name") == "qBittorrent"), None)
        is_radarr = "7878" in base_url
        cat_field   = "movieCategory"       if is_radarr else "tvCategory"
        prio_field  = "recentMoviePriority" if is_radarr else "recentTvPriority"
        prio_field2 = "olderMoviePriority"  if is_radarr else "olderTvPriority"
        payload = {
            "name": "qBittorrent",
            "enable": True,
            "protocol": "torrent",
            "priority": 1,
            "removeCompletedDownloads": True,
            "removeFailedDownloads": True,
            "fields": [
                # Same pod: localhost, so qBittorrent's localhost bypass applies and
                # the credentials are irrelevant. Sent anyway when configured.
                {"name": "host",            "value": "localhost"},
                {"name": "port",            "value": 8080},
                {"name": "useSsl",          "value": False},
                {"name": "urlBase",         "value": ""},
                {"name": "username",        "value": ADMIN_USER},
                {"name": "password",        "value": ADMIN_PASS},
                {"name": cat_field,         "value": "radarr" if is_radarr else "sonarr"},
                {"name": prio_field,        "value": 0},
                {"name": prio_field2,       "value": 0},
                {"name": "initialState",    "value": 0},
                {"name": "sequentialOrder", "value": False},
                {"name": "firstAndLast",    "value": False},
            ],
            "implementationName": "qBittorrent",
            "implementation":     "QBittorrent",
            "configContract":     "QBittorrentSettings",
            "tags": [],
        }
        if existing:
            delete(f"{base_url}/api/v3/downloadclient/{existing['id']}", api_key)
        post(f"{base_url}/api/v3/downloadclient", api_key, payload)
        print(f"{app}: qBittorrent download client {'updated' if existing else 'added'}", flush=True)

    def configure_arr_auth(base_url, api_key, app, ver="v3"):
        # Enforce forms login with the shared admin account. API-key access (this
        # script, Prowlarr sync, Bazarr, Homarr integrations) is unaffected.
        if not (ADMIN_USER and ADMIN_PASS):
            print(f"{app}: no apps-admin secret - leaving authentication as-is", flush=True)
            return
        cfg = get(f"{base_url}/api/{ver}/config/host", api_key)
        cfg.update({
            "authenticationMethod": "forms",
            "authenticationRequired": "enabled",
            "username": ADMIN_USER,
            "password": ADMIN_PASS,
            "passwordConfirmation": ADMIN_PASS,
        })
        put(f"{base_url}/api/{ver}/config/host/{cfg['id']}", api_key, cfg)
        print(f"{app}: forms login enforced for '{ADMIN_USER}'", flush=True)

    def add_flaresolverr(prowlarr_key):
        proxies = get(f"{PROWLARR_URL}/api/v1/indexerproxy", prowlarr_key)
        existing = next((p for p in proxies
            if p.get("implementation") == "FlareSolverr" or p.get("name") == "FlareSolverr"), None)
        payload = dict(existing or {})
        payload.update({
            "name": "FlareSolverr",
            "implementation": "FlareSolverr",
            "configContract": "FlareSolverrSettings",
            "fields": set_fields(payload.get("fields", []), {
                "host": FLARE_URL,
                "requestTimeout": 60,
            }),
            "tags": [],
        })
        if existing:
            put(f"{PROWLARR_URL}/api/v1/indexerproxy/{existing['id']}", prowlarr_key, payload)
        else:
            post(f"{PROWLARR_URL}/api/v1/indexerproxy", prowlarr_key, payload)
        print(f"Prowlarr: FlareSolverr proxy {'updated' if existing else 'added'}", flush=True)

    def add_prowlarr_app(prowlarr_key, app_name, app_url, app_key):
        apps = get(f"{PROWLARR_URL}/api/v1/applications", prowlarr_key)
        existing = next((a for a in apps
            if a.get("implementation") == app_name or a.get("name") == app_name), None)
        schemas = get(f"{PROWLARR_URL}/api/v1/applications/schema", prowlarr_key)
        schema = next(s for s in schemas if s.get("implementation") == app_name)
        payload = dict(existing or schema)
        # Omitting syncLevel makes Prowlarr save the app as "disabled". Always
        # reconcile existing records too, so indexers propagate after upgrades or
        # after an indexer is added to Prowlarr later.
        payload.update({
            "name": app_name,
            "implementation": app_name,
            "configContract": f"{app_name}Settings",
            "syncLevel": "fullSync",
            "fields": set_fields(payload.get("fields", schema.get("fields", [])), {
                "prowlarrUrl": PROWLARR_URL,
                "baseUrl": app_url,
                "apiKey": app_key,
            }),
            "tags": [],
        })
        if existing:
            put(f"{PROWLARR_URL}/api/v1/applications/{existing['id']}", prowlarr_key, payload)
        else:
            post(f"{PROWLARR_URL}/api/v1/applications", prowlarr_key, payload)
        print(f"Prowlarr: {app_name} app {'updated' if existing else 'added'} with full sync", flush=True)

    def add_jellyfin_notification(base_url, api_key, app):
        if not JELLYFIN_API_KEY:
            print(f"{app}: Jellyfin notification skipped (JELLYFIN_API_KEY not set)", flush=True)
            return
        notifications = get(f"{base_url}/api/v3/notification", api_key)
        existing = next((n for n in notifications
            if n.get("implementation") == "MediaBrowser" or n.get("name") == "Jellyfin"), None)
        schemas = get(f"{base_url}/api/v3/notification/schema", api_key)
        schema = next(s for s in schemas if s.get("implementation") == "MediaBrowser")
        payload = dict(existing or schema)
        payload.update({
            "name": "Jellyfin",
            "implementation": "MediaBrowser",
            "implementationName": "Emby / Jellyfin",
            "configContract": "MediaBrowserSettings",
            "onGrab": False,
            "onDownload": True,
            "onUpgrade": True,
            "onRename": True,
            "onHealthIssue": False,
            "includeHealthWarnings": False,
            "fields": set_fields(payload.get("fields", schema.get("fields", [])), {
                "host": "jellyfin.media.svc.cluster.local",
                "port": 8096,
                "useSsl": False,
                "urlBase": "",
                "apiKey": JELLYFIN_API_KEY,
                "notify": False,
                "updateLibrary": True,
            }),
            "tags": [],
        })
        # Test before saving so a bad Jellyfin key never replaces a working connection.
        post(f"{base_url}/api/v3/notification/test", api_key, payload)
        if existing:
            put(f"{base_url}/api/v3/notification/{existing['id']}", api_key, payload)
        else:
            post(f"{base_url}/api/v3/notification", api_key, payload)
        print(f"{app}: Jellyfin library-update connection {'updated' if existing else 'added'}", flush=True)

    # ── Bazarr (best-effort: its settings API is form-based and undocumented) ─

    def configure_bazarr(bazarr_key, radarr_key, sonarr_key):
        print("Waiting for Bazarr...", flush=True)
        for _ in range(120):
            try:
                req = urllib.request.Request(f"{BAZARR_URL}/api/system/status",
                    headers={"X-API-KEY": bazarr_key})
                with urllib.request.urlopen(req, timeout=5):
                    break
            except Exception:
                time.sleep(5)
        else:
            raise RuntimeError("Bazarr not ready after 10 minutes")
        print("Bazarr ready", flush=True)
        settings = {
            "settings-general-use_sonarr": "true",
            "settings-sonarr-ip":       "localhost",
            "settings-sonarr-port":     "8989",
            "settings-sonarr-base_url": "/",
            "settings-sonarr-ssl":      "false",
            "settings-sonarr-apikey":   sonarr_key,
            "settings-general-use_radarr": "true",
            "settings-radarr-ip":       "localhost",
            "settings-radarr-port":     "7878",
            "settings-radarr-base_url": "/",
            "settings-radarr-ssl":      "false",
            "settings-radarr-apikey":   radarr_key,
        }
        if ADMIN_USER and ADMIN_PASS:
            # Bazarr MD5-hashes the posted password server-side (app/config.py).
            settings.update({
                "settings-auth-type":     "form",
                "settings-auth-username": ADMIN_USER,
                "settings-auth-password": ADMIN_PASS,
            })
        data = urllib.parse.urlencode(settings).encode()
        req = urllib.request.Request(f"{BAZARR_URL}/api/system/settings", data=data, method="POST",
            headers={"X-API-KEY": bazarr_key, "Content-Type": "application/x-www-form-urlencoded"})
        with urllib.request.urlopen(req, timeout=30):
            pass
        print("Bazarr: Radarr and Sonarr connections configured", flush=True)

    # ── Seerr ────────────────────────────────────────────────────────────────

    def configure_seerr(seerr_key, radarr_key, sonarr_key):
        if not (ADMIN_USER and ADMIN_PASS):
            print("Seerr: setup skipped (apps-admin credentials not set)", flush=True)
            return

        print("Configuring Seerr...", flush=True)
        public = json_request("GET", f"{SEERR_URL}/api/v1/settings/public")
        initialized = bool(public.get("initialized"))
        jar = http.cookiejar.CookieJar()
        opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
        login = {
            "username": ADMIN_USER,
            "password": ADMIN_PASS,
            "serverType": 2,  # MediaServerType.JELLYFIN
        }
        try:
            # A half-finished wizard may already have saved the Jellyfin host even
            # while public.initialized is false. In that case Seerr rejects a new
            # hostname, but the normal login completes the administrator session.
            json_request("POST", f"{SEERR_URL}/api/v1/auth/jellyfin", login, opener=opener)
        except urllib.error.HTTPError:
            if initialized:
                raise
            jar = http.cookiejar.CookieJar()
            opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
            # A genuinely fresh instance needs the connection on its first login.
            # The hostname is a bare host; Seerr adds the scheme itself.
            login.update({
                "hostname": "jellyfin.media.svc.cluster.local",
                "port": 8096,
                "useSsl": False,
                "urlBase": "",
            })
            json_request("POST", f"{SEERR_URL}/api/v1/auth/jellyfin", login, opener=opener)
        print("Seerr: authenticated with the shared Jellyfin administrator", flush=True)

        # Refresh the Jellyfin library list and enable movie/TV libraries. This is
        # safe to re-run and picks up libraries added later.
        try:
            libraries = json_request("GET",
                f"{SEERR_URL}/api/v1/settings/jellyfin/library?sync=true", opener=opener)
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            libraries = []
            print("Seerr: Jellyfin returned no libraries yet; Arr setup will still continue", flush=True)
        enabled_ids = [str(lib["id"]) for lib in libraries
            if lib.get("type") in ("movie", "show") or lib.get("enabled")]
        if enabled_ids:
            query = urllib.parse.urlencode({"enable": ",".join(enabled_ids)})
            json_request("GET", f"{SEERR_URL}/api/v1/settings/jellyfin/library?{query}", opener=opener)
            print(f"Seerr: enabled {len(enabled_ids)} Jellyfin movie/TV libraries", flush=True)

        def preferred_profile(base_url, api_key):
            profiles = get(f"{base_url}/api/v3/qualityprofile", api_key)
            return (next((p for p in profiles if p.get("name") == "HD - 720p/1080p"), None)
                or next((p for p in profiles if p.get("name") == "HD-1080p"), None)
                or profiles[0])

        radarr_profile = preferred_profile(RADARR_URL, radarr_key)
        sonarr_profile = preferred_profile(SONARR_URL, sonarr_key)
        wanted = {
            "radarr": {
                "name": "Radarr",
                "hostname": "localhost",
                "port": 7878,
                "apiKey": radarr_key,
                "useSsl": False,
                "baseUrl": "",
                "activeProfileId": radarr_profile["id"],
                "activeProfileName": radarr_profile["name"],
                "activeDirectory": "/data/library/movies",
                "is4k": False,
                "minimumAvailability": "released",
                "isDefault": True,
                "externalUrl": LAN["radarr"],
                "syncEnabled": True,
                "preventSearch": False,
            },
            "sonarr": {
                "name": "Sonarr",
                "hostname": "localhost",
                "port": 8989,
                "apiKey": sonarr_key,
                "useSsl": False,
                "baseUrl": "",
                "activeProfileId": sonarr_profile["id"],
                "activeProfileName": sonarr_profile["name"],
                "activeDirectory": "/data/library/tv",
                "is4k": False,
                "enableSeasonFolders": True,
                "isDefault": True,
                "externalUrl": LAN["sonarr"],
                "syncEnabled": True,
                "preventSearch": False,
            },
        }
        for kind, payload in wanted.items():
            json_request("POST", f"{SEERR_URL}/api/v1/settings/{kind}/test",
                payload, opener=opener)
            existing = json_request("GET", f"{SEERR_URL}/api/v1/settings/{kind}", opener=opener)
            current = next((item for item in existing if item.get("name") == payload["name"]), None)
            if current:
                json_request("PUT", f"{SEERR_URL}/api/v1/settings/{kind}/{current['id']}",
                    payload, opener=opener)
            else:
                json_request("POST", f"{SEERR_URL}/api/v1/settings/{kind}", payload, opener=opener)
            print(f"Seerr: {payload['name']} connection {'updated' if current else 'added'}", flush=True)

        if not initialized:
            json_request("POST", f"{SEERR_URL}/api/v1/settings/initialize", {}, opener=opener)
            print("Seerr: first-run setup completed", flush=True)

    # ── Maintainerr ──────────────────────────────────────────────────────────

    def configure_maintainerr(seerr_key, radarr_key, sonarr_key):
        print("Waiting for Maintainerr...", flush=True)
        for _ in range(120):
            try:
                json_request("GET", f"{MAINTAINERR_URL}/api/health/ready", timeout=5)
                break
            except Exception:
                time.sleep(5)
        else:
            raise RuntimeError("Maintainerr not ready after 10 minutes")
        print("Maintainerr ready", flush=True)

        def mt(method, path, payload=None):
            return json_request(method, f"{MAINTAINERR_URL}{path}", payload)

        def require_ok(label, result):
            if result.get("status") != "OK":
                raise RuntimeError(f"Maintainerr {label} test failed: {result.get('message', 'unknown error')}")

        if not JELLYFIN_API_KEY:
            raise RuntimeError("Maintainerr needs JELLYFIN_API_KEY")
        jf_users = json_request("GET", f"{SVC['jellyfin']}/Users",
            headers={"X-Emby-Token": JELLYFIN_API_KEY})
        jf_user = next((u for u in jf_users if u.get("Name", "").lower() == ADMIN_USER.lower()), None)
        jellyfin = {
            "jellyfin_url": SVC["jellyfin"],
            "jellyfin_api_key": JELLYFIN_API_KEY,
        }
        if jf_user:
            jellyfin["jellyfin_user_id"] = jf_user["Id"]
        require_ok("Jellyfin", mt("POST", "/api/settings/jellyfin/test", jellyfin))
        require_ok("Jellyfin save", mt("POST", "/api/settings/jellyfin", jellyfin))
        print("Maintainerr: Jellyfin connection configured", flush=True)

        for kind, name, url, api_key in [
            ("radarr", "Radarr", RADARR_URL, radarr_key),
            ("sonarr", "Sonarr", SONARR_URL, sonarr_key),
        ]:
            payload = {"serverName": name, "url": url, "apiKey": api_key}
            require_ok(name, mt("POST", f"/api/settings/test/{kind}", payload))
            existing = mt("GET", f"/api/settings/{kind}")
            current = next((item for item in existing if item.get("serverName") == name), None)
            result = mt("PUT", f"/api/settings/{kind}/{current['id']}", payload) if current \
                else mt("POST", f"/api/settings/{kind}", payload)
            require_ok(f"{name} save", result)
            print(f"Maintainerr: {name} connection {'updated' if current else 'added'}", flush=True)

        seerr = {"url": SEERR_URL, "api_key": seerr_key}
        require_ok("Seerr", mt("POST", "/api/settings/test/seerr", seerr))
        require_ok("Seerr save", mt("POST", "/api/settings/seerr", seerr))
        print("Maintainerr: Seerr connection configured", flush=True)

        if ADMIN_USER and ADMIN_PASS:
            download_client = {
                "download_client_url": QB_URL,
                "download_client_username": ADMIN_USER,
                "download_client_password": ADMIN_PASS,
                "download_client_delete_data": True,
                "download_client_fallback_ratio": 0.5,
            }
            require_ok("qBittorrent", mt("POST", "/api/settings/test/download-client", download_client))
            require_ok("qBittorrent save", mt("POST", "/api/settings/download-client", download_client))
            print("Maintainerr: qBittorrent connection configured", flush=True)

        if not mt("GET", "/api/settings/test/setup"):
            raise RuntimeError("Maintainerr still reports an incomplete setup")
        print("Maintainerr: setup and all configured connections verified", flush=True)

    # ── Jellyfin ──────────────────────────────────────────────────────────────

    def configure_jellyfin_libraries():
        if not JELLYFIN_API_KEY:
            print("Jellyfin: library setup skipped (JELLYFIN_API_KEY not set)", flush=True)
            return
        headers = {"X-Emby-Token": JELLYFIN_API_KEY}
        base = SVC["jellyfin"]
        folders = json_request("GET", f"{base}/Library/VirtualFolders", headers=headers)
        wanted = [
            ("Movies", "movies", "/media/library/movies"),
            ("TV Shows", "tvshows", "/media/library/tv"),
        ]
        for name, collection_type, path in wanted:
            existing = next((folder for folder in folders
                if folder.get("CollectionType") == collection_type
                or path in (folder.get("Locations") or [])), None)
            if existing:
                print(f"Jellyfin: {name} library already configured", flush=True)
                continue
            query = urllib.parse.urlencode({
                "name": name,
                "collectionType": collection_type,
                "paths": path,
                "refreshLibrary": "true",
            })
            json_request("POST", f"{base}/Library/VirtualFolders?{query}", {}, headers=headers)
            print(f"Jellyfin: {name} library added at {path}", flush=True)

    def sync_jellyfin_admin():
        # Ensure the shared admin account exists in Jellyfin with the shared
        # password. Seerr signs in with Jellyfin, so this covers it too.
        base = SVC["jellyfin"]

        def jf(method, path, payload=None):
            data = json.dumps(payload).encode() if payload is not None else None
            req = urllib.request.Request(f"{base}{path}", data=data, method=method,
                headers={"X-Emby-Token": JELLYFIN_API_KEY, "Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=30) as r:
                content = r.read()
                return json.loads(content) if content else None

        users = jf("GET", "/Users")
        user = next((u for u in users if u["Name"].lower() == ADMIN_USER.lower()), None)
        if user is None:
            user = jf("POST", "/Users/New", {"Name": ADMIN_USER, "Password": ADMIN_PASS})
            policy = user.get("Policy", {})
            policy["IsAdministrator"] = True
            policy["EnableAllFolders"] = True
            jf("POST", f"/Users/{user['Id']}/Policy", policy)
            print(f"Jellyfin: admin user '{ADMIN_USER}' created", flush=True)
        else:
            jf("POST", f"/Users/{user['Id']}/Password", {"NewPw": ADMIN_PASS, "ResetPassword": False})
            print(f"Jellyfin: password synced for '{user['Name']}'", flush=True)

    # ── Homarr ────────────────────────────────────────────────────────────────
    # REST (OpenAPI) endpoints are used where they exist; integrations are only
    # exposed over tRPC, which accepts the same ApiKey header. tRPC uses
    # superjson, so inputs are wrapped in {"json": ...}.

    def homarr_rest(method, path, payload=None):
        data = json.dumps(payload).encode() if payload is not None else None
        req = urllib.request.Request(f"{HOMARR_URL}{path}", data=data, method=method,
            headers={"ApiKey": HOMARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=90) as r:
            content = r.read()
            return json.loads(content) if content else None

    def homarr_trpc_query(proc):
        req = urllib.request.Request(f"{HOMARR_URL}/api/trpc/{proc}",
            headers={"ApiKey": HOMARR_API_KEY})
        with urllib.request.urlopen(req, timeout=30) as r:
            return json.loads(r.read())["result"]["data"]["json"]

    def homarr_trpc_mutation(proc, payload):
        data = json.dumps({"json": payload}).encode()
        req = urllib.request.Request(f"{HOMARR_URL}/api/trpc/{proc}", data=data, method="POST",
            headers={"ApiKey": HOMARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=90) as r:
            body = json.loads(r.read())
            return body.get("result", {}).get("data", {}).get("json")

    def provision_homarr(keys):
        print("Waiting for Homarr...", flush=True)
        for _ in range(120):
            try:
                homarr_rest("GET", "/api/apps")
                break
            except Exception:
                time.sleep(5)
        else:
            raise RuntimeError("Homarr not ready after 10 minutes")
        print("Homarr ready", flush=True)

        # name -> (icon, lan url, description)
        tiles = {
            "Jellyfin":    (f"{ICONS}/svg/jellyfin.svg",    LAN["jellyfin"],    "Movies and TV"),
            "Seerr":       (f"{ICONS}/svg/seerr.svg",       LAN["seerr"],       "Request movies and TV"),
            "Radarr":      (f"{ICONS}/svg/radarr.svg",      LAN["radarr"],      "Movie management"),
            "Sonarr":      (f"{ICONS}/svg/sonarr.svg",      LAN["sonarr"],      "TV management"),
            "Prowlarr":    (f"{ICONS}/svg/prowlarr.svg",    LAN["prowlarr"],    "Indexer management"),
            "qBittorrent": (f"{ICONS}/svg/qbittorrent.svg", LAN["qbittorrent"], "Torrent client"),
            "Bazarr":      (f"{ICONS}/svg/bazarr.svg",      LAN["bazarr"],      "Subtitles"),
            "Maintainerr": (f"{ICONS}/png/maintainerr.png", LAN["maintainerr"], "Library cleanup"),
            "Immich":      (f"{ICONS}/svg/immich.svg",      LAN["immich"],      "Photos"),
        }
        existing_apps = {a["name"] for a in homarr_rest("GET", "/api/apps")}
        for name, (icon, href, desc) in tiles.items():
            if name in existing_apps:
                print(f"Homarr: app '{name}' already exists", flush=True)
                continue
            homarr_rest("POST", "/api/apps", {
                "name": name, "iconUrl": icon, "href": href,
                "pingUrl": href, "description": desc,
            })
            print(f"Homarr: app '{name}' created", flush=True)
        app_ids = {a["name"]: a["id"] for a in homarr_rest("GET", "/api/apps")}

        # kind -> (display name, service url, secrets)
        wanted = {
            "radarr":   ("Radarr",   SVC["radarr"],   [{"kind": "apiKey", "value": keys["radarr"]}]),
            "sonarr":   ("Sonarr",   SVC["sonarr"],   [{"kind": "apiKey", "value": keys["sonarr"]}]),
            "prowlarr": ("Prowlarr", SVC["prowlarr"], [{"kind": "apiKey", "value": keys["prowlarr"]}]),
            "bazarr":   ("Bazarr",   SVC["bazarr"],   [{"kind": "apiKey", "value": keys["bazarr"]}]),
            "seerr":    ("Seerr",    SVC["seerr"],    [{"kind": "apiKey", "value": keys["seerr"]}]),
        }
        if ADMIN_USER and ADMIN_PASS:
            wanted["qBittorrent"] = ("qBittorrent", SVC["qbittorrent"],
                [{"kind": "username", "value": ADMIN_USER}, {"kind": "password", "value": ADMIN_PASS}])
        else:
            print("Homarr: skipping qBittorrent integration (no apps-admin secret)", flush=True)
        if JELLYFIN_API_KEY:
            wanted["jellyfin"] = ("Jellyfin", SVC["jellyfin"],
                [{"kind": "apiKey", "value": JELLYFIN_API_KEY}])
        else:
            print("Homarr: skipping Jellyfin integration (JELLYFIN_API_KEY not set)", flush=True)

        existing = {i["kind"]: i["id"] for i in homarr_trpc_query("integration.all")}
        for kind, (name, url, secrets) in wanted.items():
            if kind in existing:
                if kind == "qBittorrent":
                    # Credential-based integration: re-assert the shared admin
                    # credentials so a password rotation propagates to Homarr.
                    try:
                        homarr_trpc_mutation("integration.update", {
                            "id": existing[kind], "name": name, "url": url,
                            "secrets": secrets, "appId": app_ids.get(name),
                        })
                        print(f"Homarr: integration '{name}' credentials synced", flush=True)
                    except Exception as e:
                        print(f"Homarr: integration '{name}' credential sync failed ({e})", flush=True)
                else:
                    print(f"Homarr: integration '{name}' already exists", flush=True)
                continue
            payload = {
                "name": name, "url": url, "kind": kind, "secrets": secrets,
                "attemptSearchEngineCreation": False,
            }
            if name in app_ids:
                payload["app"] = {"id": app_ids[name]}
            try:
                result = homarr_trpc_mutation("integration.create", payload)
                if result and result.get("error"):
                    print(f"Homarr: integration '{name}' connection test failed: {result['error']}", flush=True)
                else:
                    print(f"Homarr: integration '{name}' created", flush=True)
            except Exception as e:
                print(f"Homarr: integration '{name}' failed ({e}) - configure manually if needed", flush=True)
        integrations = {i["kind"]: i["id"] for i in homarr_trpc_query("integration.all")}

        boards = homarr_rest("GET", "/api/boards")
        board = next((b for b in boards if b["name"] == "media"), None)
        if board:
            print("Homarr: board 'media' already exists - leaving layout alone", flush=True)
            return
        board_id = homarr_rest("POST", "/api/boards",
            {"name": "media", "columnCount": 10, "isPublic": False})["boardId"]
        print("Homarr: board 'media' created", flush=True)

        def add_item(kind, options=None, integration_kinds=()):
            ids = [integrations[k] for k in integration_kinds if k in integrations]
            if integration_kinds and not ids:
                return
            homarr_rest("POST", "/api/boards/items", {
                "boardId": board_id, "kind": kind,
                "options": options or {}, "integrationIds": ids,
            })
            print(f"Homarr: added '{kind}' to board", flush=True)

        for name in tiles:
            if name in app_ids:
                add_item("app", {"appId": app_ids[name]})
        add_item("calendar",                  integration_kinds=("radarr", "sonarr"))
        add_item("downloads",                 integration_kinds=("qBittorrent",))
        add_item("mediaServer",               integration_kinds=("jellyfin",))
        add_item("mediaRequests-requestList", integration_kinds=("seerr",))
        add_item("mediaRequests-requestStats", integration_kinds=("seerr",))
        add_item("indexerManager",            integration_kinds=("prowlarr",))
        homarr_rest("PATCH", f"/api/boards/{board_id}/home", {})
        print("Homarr: board 'media' set as home board", flush=True)

    # ── main ──────────────────────────────────────────────────────────────────

    print("Bootstrap starting...", flush=True)

    print("Reading API keys from config volumes...", flush=True)
    keys = {
        "radarr":   read_arr_key("/config/radarr/config.xml"),
        "sonarr":   read_arr_key("/config/sonarr/config.xml"),
        "prowlarr": read_arr_key("/config/prowlarr/config.xml"),
        "bazarr":   read_bazarr_key("/config/bazarr/config/config.yaml"),
        "seerr":    read_seerr_key("/config/seerr/settings.json"),
    }

    wait_ready(RADARR_URL,   keys["radarr"],   "Radarr")
    wait_ready(SONARR_URL,   keys["sonarr"],   "Sonarr")
    wait_ready(PROWLARR_URL, keys["prowlarr"], "Prowlarr", "v1")

    configure_qbittorrent()
    configure_arr_auth(RADARR_URL,   keys["radarr"],   "Radarr")
    configure_arr_auth(SONARR_URL,   keys["sonarr"],   "Sonarr")
    configure_arr_auth(PROWLARR_URL, keys["prowlarr"], "Prowlarr", "v1")
    add_root_folder(RADARR_URL, keys["radarr"], "Radarr", "/data/library/movies")
    add_root_folder(SONARR_URL, keys["sonarr"], "Sonarr", "/data/library/tv")
    add_qbittorrent_client(RADARR_URL, keys["radarr"], "Radarr")
    add_qbittorrent_client(SONARR_URL, keys["sonarr"], "Sonarr")
    add_flaresolverr(keys["prowlarr"])
    add_prowlarr_app(keys["prowlarr"], "Radarr", RADARR_URL, keys["radarr"])
    add_prowlarr_app(keys["prowlarr"], "Sonarr", SONARR_URL, keys["sonarr"])
    add_jellyfin_notification(RADARR_URL, keys["radarr"], "Radarr")
    add_jellyfin_notification(SONARR_URL, keys["sonarr"], "Sonarr")

    try:
        configure_bazarr(keys["bazarr"], keys["radarr"], keys["sonarr"])
    except Exception as e:
        print(f"Bazarr: wiring failed ({type(e).__name__}: {e}) - configure manually if needed", flush=True)

    if ADMIN_USER and ADMIN_PASS and JELLYFIN_API_KEY:
        try:
            sync_jellyfin_admin()
        except Exception as e:
            print(f"Jellyfin: admin sync failed ({type(e).__name__}: {e}) - configure manually if needed", flush=True)
    else:
        print("Jellyfin: admin sync skipped (needs apps-admin secret and JELLYFIN_API_KEY)", flush=True)

    configure_jellyfin_libraries()

    # Seerr's own API key cannot administer its settings. Log in with the shared
    # Jellyfin admin to complete first-run setup and reconcile its Arr instances.
    configure_seerr(keys["seerr"], keys["radarr"], keys["sonarr"])

    # Maintainerr has an unauthenticated LAN settings API. Reconcile every service
    # it can use so its cleanup engine is ready without a browser wizard.
    configure_maintainerr(keys["seerr"], keys["radarr"], keys["sonarr"])

    if HOMARR_API_KEY:
        # A failure here must not crash-loop the pod and re-run the arr wiring
        # forever; log it and retry on the next pod restart instead.
        try:
            provision_homarr(keys)
        except Exception as e:
            print(f"Homarr: provisioning failed ({type(e).__name__}: {e})", flush=True)
    else:
        print("Homarr: HOMARR_API_KEY not set - skipping dashboard provisioning.", flush=True)
        print("Homarr: create the admin account, then an API key under Management > Tools > API,", flush=True)
        print("Homarr: add it to platform/secrets/media-secrets.yaml, reseal, and restart this pod.", flush=True)

    print("Bootstrap complete!", flush=True)
    while True:
        time.sleep(86400)
