---
k3s_channel: stable
k3s_disable:
  - traefik
  - servicelb

# Terraform attaches one blank data disk with this exact serial. The prepare play identifies it
# by serial, never by a changeable /dev/sdX path.
initialize_data_disk: true
data_mount_path: /mnt/data

# Node OS disks are backed by Proxmox `local`; dynamic config/database PVCs
# therefore remain off `local-lvm` while following their scheduled worker.
k3s_local_storage_path: /var/lib/rancher/k3s/storage
